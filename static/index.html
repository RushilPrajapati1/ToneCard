<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tonecard · mood discovery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <script>
    (function() {
      try {
        var saved = localStorage.getItem("tonecard-theme");
        var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    :root {
      --paper: oklch(0.985 0.005 85);
      --paper-2: oklch(0.965 0.006 85);
      --ink: oklch(0.18 0.01 80);
      --ink-hover: oklch(0.28 0.01 80);
      --ink-2: oklch(0.32 0.01 80);
      --muted: oklch(0.55 0.012 80);
      --line: oklch(0.905 0.006 85);
      --line-2: oklch(0.86 0.008 85);
      --accent: oklch(0.60 0.22 30);
      --accent-soft: oklch(0.94 0.05 30);
      --accent-ink: oklch(0.38 0.14 30);
      --focus-ring: oklch(0.18 0.01 80 / 0.10);
      --shadow: 0 1px 0 oklch(0.85 0.01 80 / 0.5), 0 8px 24px -12px oklch(0.2 0.02 80 / 0.18);
      --r-sm: 8px;
      --r-md: 14px;
      --r-lg: 22px;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --paper: oklch(0.18 0.008 260);
      --paper-2: oklch(0.23 0.009 260);
      --ink: oklch(0.96 0.005 85);
      --ink-hover: oklch(0.86 0.005 85);
      --ink-2: oklch(0.82 0.006 85);
      --muted: oklch(0.64 0.012 85);
      --line: oklch(0.30 0.009 260);
      --line-2: oklch(0.38 0.010 260);
      --accent: oklch(0.72 0.20 30);
      --accent-soft: oklch(0.30 0.09 30);
      --accent-ink: oklch(0.88 0.17 30);
      --focus-ring: oklch(0.96 0.005 85 / 0.18);
      --shadow: 0 1px 0 oklch(0.10 0.01 260 / 0.6), 0 8px 24px -12px oklch(0.04 0.01 260 / 0.6);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.005em;
    }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-feature-settings: "tnum", "ss01"; }
    .serif { font-family: "Instrument Serif", "Times New Roman", serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 36px 96px;
    }
    @media (max-width: 720px) {
      .shell { padding: 20px 18px 64px; }
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 10px 0 28px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 32px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--ink);
      color: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      flex-shrink: 0;
    }
    .brand small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 2px; }

    .spacer { flex: 1; }

    .theme-toggle {
      appearance: none;
      width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      background: var(--paper-2);
      color: var(--ink-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
    }
    .theme-toggle:hover { color: var(--ink); border-color: var(--ink-2); }
    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .theme-toggle svg { width: 16px; height: 16px; display: block; }

    .hero { margin-bottom: 28px; }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    h1.display {
      font-family: "Bricolage Grotesque", inherit;
      font-weight: 700;
      letter-spacing: -0.04em;
      font-size: clamp(36px, 5vw, 56px);
      line-height: 1.02;
      margin: 0 0 10px;
    }
    h1.display em { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; color: var(--accent); letter-spacing: -0.01em; padding-right: 4px; }
    .lede { color: var(--muted); font-size: 16px; max-width: 56ch; margin: 0; }

    h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 32px 0 14px;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    h2 .count { color: var(--ink-2); font-weight: 500; letter-spacing: -0.005em; text-transform: none; font-size: 13px; }

    .results { display: flex; flex-direction: column; gap: 2px; }
    .track {
      display: grid;
      grid-template-columns: 28px 60px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 12px 14px;
      border-radius: var(--r-md);
      transition: background 120ms ease;
    }
    .track:hover { background: var(--paper-2); }
    .track .idx {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--accent);
      opacity: 0.7;
      text-align: right;
      letter-spacing: 0;
    }
    .track .art {
      width: 60px; height: 60px;
      border-radius: 10px;
      background: var(--paper-2);
      object-fit: cover;
      border: 1px solid var(--line);
    }
    .ph-art {
      width: 60px; height: 60px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background-image: repeating-linear-gradient(
        45deg,
        var(--paper-2) 0 4px,
        var(--paper) 4px 8px
      );
    }
    .track .body { min-width: 0; }
    .track .name {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.012em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track .meta {
      color: var(--muted);
      font-size: 14px;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track .album { color: var(--muted); }
    .track .features {
      margin-top: 4px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--ink-2);
      letter-spacing: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
    }
    .track .features span b { font-weight: 500; color: var(--ink); }
    .track .features span.sep { color: var(--line-2); }
    .track .open {
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: color 120ms, border-color 120ms;
      white-space: nowrap;
    }
    .track .open:hover { color: var(--ink); border-color: var(--line-2); }
    .track .open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-family: inherit;
      font-size: 13px;
      color: var(--ink-2);
      cursor: pointer;
      transition: color 120ms, border-color 120ms, background 120ms;
    }
    .chip:hover { color: var(--ink); border-color: var(--ink-2); }
    .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .chip.active { background: var(--accent); color: var(--paper); border-color: var(--accent); }

    .empty, .info, .error {
      padding: 16px 4px;
      color: var(--muted);
      font-size: 14px;
    }
    .error { color: var(--accent); }
    .info code {
      background: var(--paper-2);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    .info--compact { padding: 0; color: var(--muted); font-size: 13px; }
    .empty-presets { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }

    .error-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 4px;
      flex-wrap: wrap;
    }
    .error-msg { color: var(--accent); font-size: 14px; }
    .error-retry {
      appearance: none;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: inherit;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background 120ms, color 120ms;
    }
    .error-retry:hover { background: var(--accent); color: var(--paper); }
    .error-retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .skel {
      background: linear-gradient(90deg, var(--paper-2) 0%, var(--line) 50%, var(--paper-2) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) {
      .skel { animation: none; }
      .track, .chip, .mood-preset, .theme-toggle, .track .open, .error-retry { transition: none; }
    }

    .demo-banner {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      padding: 8px 16px;
      background: var(--accent-soft);
      color: var(--accent-ink);
      border: 1px solid var(--accent);
      border-radius: var(--r-sm);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .demo-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--accent); flex-shrink: 0; }

    .mood-wrap {
      display: grid;
      grid-template-columns: minmax(0, 420px) 1fr;
      gap: 28px;
      align-items: start;
      margin-bottom: 28px;
    }
    @media (max-width: 760px) {
      .mood-wrap { grid-template-columns: 1fr; }
    }
    .mood-plane {
      position: relative;
      aspect-ratio: 1;
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background:
        radial-gradient(circle, var(--line) 1px, transparent 1px) 0 0 / 24px 24px,
        var(--paper-2);
      padding: 28px;
      box-sizing: border-box;
    }
    .mood-plane svg {
      width: 100%; height: 100%;
      display: block;
      cursor: crosshair;
      user-select: none;
    }
    .mood-plane svg:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: calc(var(--r-md) - 4px);
    }
    .mood-axis-label {
      position: absolute;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      pointer-events: none;
    }
    .mood-axis-label.top    { top: 8px;    left: 50%; transform: translateX(-50%); }
    .mood-axis-label.bottom { bottom: 8px; left: 50%; transform: translateX(-50%); }
    .mood-axis-label.left   { left: 8px;   top: 50%;  transform: translateY(-50%) rotate(-90deg); transform-origin: left center; }
    .mood-axis-label.right  { right: 8px;  top: 50%;  transform: translateY(-50%) rotate(90deg);  transform-origin: right center; }

    .plane-wrap { position: relative; }
    .seed-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paper-2);
      border-radius: var(--r-md);
      opacity: 0.9;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .mood-side {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .mood-coord {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      color: var(--ink-2);
    }
    .mood-coord b { color: var(--ink); font-weight: 500; }
    .mood-presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .mood-preset {
      appearance: none;
      background: var(--paper-2);
      border: 1px solid var(--line);
      color: var(--ink-2);
      font-family: inherit;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 120ms, border-color 120ms;
    }
    .mood-preset:hover { color: var(--ink); border-color: var(--ink-2); }
    .mood-preset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .genre-section { margin-bottom: 20px; }
    .genre-label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .tab-bar {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 32px;
    }
    .tab {
      appearance: none;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 9px 18px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: color 120ms, border-color 120ms;
      letter-spacing: -0.01em;
    }
    .tab:hover { color: var(--ink); }
    .tab.tab-active { color: var(--ink); border-bottom-color: var(--accent); }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    .search-form {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }
    .search-input {
      flex: 1;
      appearance: none;
      font-family: inherit;
      font-size: 15px;
      padding: 10px 14px;
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      color: var(--ink);
      transition: border-color 120ms, box-shadow 120ms;
      min-width: 0;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
    .search-btn {
      appearance: none;
      background: var(--accent);
      color: var(--paper);
      border: none;
      border-radius: var(--r-md);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 22px;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 120ms;
      letter-spacing: -0.01em;
    }
    .search-btn:hover { opacity: 0.88; }
    .search-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .search-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }

    .search-found { margin-bottom: 20px; }
    .search-found-label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .track.highlight {
      background: var(--accent-soft);
      border: 1px solid color-mix(in oklch, var(--accent) 35%, transparent);
    }
    .track.highlight .idx { color: var(--accent); opacity: 1; }

    .upload-card {
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .upload-card-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .upload-card-feat {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0;
    }
    .upload-card-feat b { color: var(--ink-2); font-weight: 500; }

    .foot {
      margin-top: 48px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .foot a { color: var(--ink-2); text-decoration: none; }
    .foot a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    const KEY_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
    const keyLabel = (k, mode) => {
      if (k == null) return "";
      const name = KEY_NAMES[k] || "?";
      return mode === 0 ? name + "m" : name;
    };

    function friendlyError(err) {
      if (!err) return "Search failed.";
      if (err.status === 429) return "Spotify's rate limit was hit — wait a moment and try again.";
      if (err.status === 503 || err.status === 502) return "The server is temporarily unavailable. Reload and try again.";
      if (err.status >= 500) return "Something went wrong on our end. Reload and try again.";
      if (err.status === 404) return "That resource wasn't found.";
      return err.message || "Search failed.";
    }

      { tempo: 138.0, key: 5, mode: 0, energy: 0.18, danceability: 0.21, valence: 0.16, acousticness: 0.99 },
      { tempo: 110.5, key: 2, mode: 0, energy: 0.62, danceability: 0.59, valence: 0.41, acousticness: 0.07 },
      { tempo: 124.0, key: 7, mode: 1, energy: 0.81, danceability: 0.74, valence: 0.55, acousticness: 0.04 },
      { tempo: 76.2,  key: 4, mode: 1, energy: 0.22, danceability: 0.28, valence: 0.62, acousticness: 0.92 },
      { tempo: 118.0, key: 0, mode: 1, energy: 0.55, danceability: 0.66, valence: 0.71, acousticness: 0.31 },
    ];

    const DEMO_SEED = [
      { id: "h1", name: "Avril 14th",        artists: ["Aphex Twin"],   valence: 0.18, energy: 0.18 },
      { id: "h2", name: "An Ending (Ascent)",artists: ["Brian Eno"],    valence: 0.35, energy: 0.18 },
      { id: "h3", name: "Cirrus",            artists: ["Bonobo"],       valence: 0.52, energy: 0.62 },
      { id: "h4", name: "Open Eye Signal",   artists: ["Jon Hopkins"],  valence: 0.55, energy: 0.81 },
      { id: "h5", name: "Ekstasis",          artists: ["J. Barwick"],   valence: 0.34, energy: 0.42 },
      { id: "h6", name: "Saada Bonaire",     artists: ["Saada Bonaire"],valence: 0.71, energy: 0.55 },
    ];

    const GENRES = [
      { label: "All moods",  query: null },
      { label: "Pop",        query: "pop" },
      { label: "Hip-Hop",    query: "hip hop" },
      { label: "Rock",       query: "rock" },
      { label: "R&B",        query: "r&b" },
      { label: "Electronic", query: "electronic" },
      { label: "Jazz",       query: "jazz" },
      { label: "Classical",  query: "classical" },
      { label: "Latin",      query: "latin" },

    ];

    async function safeFetch(url, opts) {
      try {
        const r = await fetch(url, opts);
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          const err = new Error(j.error || `HTTP ${r.status}`);
          err.status = r.status; err.body = j;
          throw err;
        }
        return await r.json();
      } catch (e) {
        if (e.status) throw e;
        e.demo = true;
        throw e;
      }
    }

    const DEMO_SEARCH = {
      track: {
        id: "demo-found", name: "Blinding Lights", artists: ["The Weeknd"],
        album: "After Hours", popularity: 95, image: null, url: null,
        features: { valence: 0.335, energy: 0.730, tempo: 171.0, danceability: 0.514 },
      },
      genre: "canadian pop",
      similar: DEMO_TRACKS.slice(0, 5).map((t, i) => ({
        ...t, id: "ds" + i,
        features: { valence: DEMO_FEAT[i].valence, energy: DEMO_FEAT[i].energy, tempo: DEMO_FEAT[i].tempo, danceability: DEMO_FEAT[i].danceability },
      })),
      pool_points: DEMO_SEED,
      candidate_count: 6,
    };

    function SearchTab() {
      const [query, setQuery] = useState("");
      const [result, setResult] = useState(null);
      const [similar, setSimilar] = useState([]);
      const [point, setPoint] = useState(null);
      const [loading, setLoading] = useState(false);
      const [similarLoading, setSimilarLoading] = useState(false);
      const [error, setError] = useState(null);
      const [similarError, setSimilarError] = useState(null);
      const [demoMode, setDemoMode] = useState(false);
      const [announcement, setAnnouncement] = useState("");

      async function doSearch(q) {
        if (!q.trim()) return;
        setLoading(true);
        setError(null);
        setSimilarError(null);
        setResult(null);
        setSimilar([]);
        setPoint(null);
        setAnnouncement("Searching…");
        try {
          const data = await safeFetch(`/api/search?q=${encodeURIComponent(q)}&count=10`);
          setResult(data);
          setSimilar(data.similar || []);
          setPoint({ valence: data.track.features.valence, energy: data.track.features.energy });
          setDemoMode(false);
          setAnnouncement(`Found: ${data.track.name}`);
        } catch (err) {
          if (err.demo) {
            setResult(DEMO_SEARCH);
            setSimilar(DEMO_SEARCH.similar);
            setPoint({ valence: DEMO_SEARCH.track.features.valence, energy: DEMO_SEARCH.track.features.energy });
            setDemoMode(true);
            setAnnouncement("Showing sample data. Server unreachable.");
          } else {
            setError(friendlyError(err));
            setAnnouncement(`Error: ${friendlyError(err)}`);
          }
        } finally {
          setLoading(false);
        }
      }

      async function pickOnPlane(p) {
        if (!result) return;
        setPoint(p);
        setSimilarLoading(true);
        setSimilarError(null);
        setAnnouncement("Loading tracks…");
        const url = result.genre
          ? `/api/genre?genre=${encodeURIComponent(result.genre)}&valence=${p.valence.toFixed(3)}&energy=${p.energy.toFixed(3)}&count=10`
          : `/api/mood?valence=${p.valence.toFixed(3)}&energy=${p.energy.toFixed(3)}&count=10`;
        try {
          const data = await safeFetch(url);
          setSimilar(data.recommendations || []);
          setDemoMode(false);
          const n = (data.recommendations || []).length;
          setAnnouncement(`Found ${n} track${n === 1 ? "" : "s"} near this point.`);
        } catch (err) {
          if (err.demo) {
            setSimilar(DEMO_SEARCH.similar);
            setDemoMode(true);
          } else {
            setSimilarError(friendlyError(err));
            setAnnouncement(`Error: ${friendlyError(err)}`);
          }
        } finally {
          setSimilarLoading(false);
        }
      }

      const atFoundTrack = result && point &&
        Math.abs(point.valence - result.track.features.valence) < 0.001 &&
        Math.abs(point.energy - result.track.features.energy) < 0.001;

      return (
        <section>
          <div className="sr-only" aria-live="polite" aria-atomic="true">{announcement}</div>

          <div className="hero">
            <div className="eyebrow">Search</div>
            <h1 className="display">Find a <em>song</em>, discover similar.</h1>
            <p className="lede">Search any track — we'll pinpoint its mood and surface similar songs from its genre via ReccoBeats.</p>
          </div>

          {demoMode && (
            <div className="demo-banner" role="alert">
              <span className="demo-dot" aria-hidden="true" />
              Sample data only · server unreachable. Results below are not real.
            </div>
          )}

          <form className="search-form" onSubmit={e => { e.preventDefault(); doSearch(query); }}>
            <input
              className="search-input"
              type="search"
              placeholder="e.g. Blinding Lights, Bohemian Rhapsody, Lose Yourself…"
              value={query}
              onChange={e => setQuery(e.target.value)}
              aria-label="Search for a song"
            />
            <button className="search-btn" type="submit" disabled={loading || !query.trim()}>
              {loading ? "Searching…" : "Search"}
            </button>
          </form>

          {error && (
            <div className="error-wrap" role="alert">
              <span className="error-msg">{error}</span>
              <button className="error-retry" onClick={() => doSearch(query)}>Try again</button>
            </div>
          )}

          {loading && <SkeletonList n={4} withFeatures />}

          {!loading && result && (
            <>
              <div className="search-found">
                <div className="search-found-label">Found</div>
                <div className="results">
                  <TrackRow t={result.track} i={-1} showFeatures demoMode={demoMode} highlight />
                </div>
              </div>

              <div className="mood-wrap">
                <div className="plane-wrap">
                  <MoodPlane
                    points={result.pool_points || []}
                    point={point}
                    pointLabel={atFoundTrack ? result.track.name : null}
                    onPick={pickOnPlane}
                  />
                </div>
                <div className="mood-side">
                  <div className="mood-coord">
                    {atFoundTrack
                      ? <span>Your song · <b>valence {point.valence.toFixed(2)}</b> · <b>energy {point.energy.toFixed(2)}</b></span>
                      : <span>Picked <b>valence {point.valence.toFixed(2)}</b> · <b>energy {point.energy.toFixed(2)}</b></span>
                    }
                  </div>
                  {result.genre && (
                    <div className="info--compact">Genre pool: <span className="mono">{result.genre}</span></div>
                  )}
                  <div className="info--compact">
                    Showing <span className="mono">{similar.length}</span> of <span className="mono">{result.candidate_count}</span> candidates.
                  </div>
                  <div className="info--compact" style={{color: "var(--muted)"}}>
                    Click anywhere on the plane to explore the genre.
                  </div>
                </div>
              </div>

              {similarError && (
                <div className="error-wrap" role="alert">
                  <span className="error-msg">{similarError}</span>
                </div>
              )}

              <h2>
                {atFoundTrack ? "Similar songs" : "Tracks near this mood"}
                {result.genre ? <> in <span style={{textTransform:"none", letterSpacing:0, fontWeight:400}}>{result.genre}</span></> : ""}
                <span className="count"> · {similar.length}</span>
              </h2>

              {similarLoading && <SkeletonList n={4} withFeatures />}
              {!similarLoading && (
                similar.length === 0
                  ? <div className="empty">No tracks found near that point. Try clicking elsewhere on the plane.</div>
                  : <div className="results">
                      {similar.map((t, i) => <TrackRow key={t.id || i} t={t} i={i} showFeatures demoMode={demoMode} />)}
                    </div>
              )}
            </>
          )}
        </section>
      );
    }

    function MoodPlane({ points, point, pointLabel, onPick }) {
      const SIZE = 360;
      const STEP = 0.05;
      const BIG_STEP = 0.20;
      const [kPos, setKPos] = useState(null);

      function handleClick(e) {
        const rect = e.currentTarget.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;
        const valence = Math.max(0, Math.min(1, x));
        const energy  = Math.max(0, Math.min(1, 1 - y));
        setKPos(null);
        onPick({ valence, energy });
      }

      function handleFocus() {
        if (!kPos) setKPos(point || { valence: 0.5, energy: 0.5 });
      }

      function handleBlur() {
        setKPos(null);
      }

      function handleKeyDown(e) {
        const cur = kPos || point || { valence: 0.5, energy: 0.5 };
        const step = e.shiftKey ? BIG_STEP : STEP;
        let { valence, energy } = cur;

        switch (e.key) {
          case "ArrowRight": valence = Math.min(1, +(valence + step).toFixed(3)); break;
          case "ArrowLeft":  valence = Math.max(0, +(valence - step).toFixed(3)); break;
          case "ArrowUp":    energy  = Math.min(1, +(energy  + step).toFixed(3)); break;
          case "ArrowDown":  energy  = Math.max(0, +(energy  - step).toFixed(3)); break;
          case "Enter":
          case " ":
            if (kPos) onPick(kPos);
            e.preventDefault();
            return;
          default: return;
        }
        e.preventDefault();
        setKPos({ valence, energy });
      }

      return (
        <div className="mood-plane">
          <div className="mood-axis-label top" aria-hidden="true">Intense</div>
          <div className="mood-axis-label bottom" aria-hidden="true">Calm</div>
          <div className="mood-axis-label left" aria-hidden="true">Sad</div>
          <div className="mood-axis-label right" aria-hidden="true">Happy</div>
          <svg
            viewBox={`0 0 ${SIZE} ${SIZE}`}
            onClick={handleClick}
            onKeyDown={handleKeyDown}
            onFocus={handleFocus}
            onBlur={handleBlur}
            tabIndex={0}
            role="application"
            aria-label="Mood plane. Use arrow keys to move the cursor, Enter or Space to search. Left and right adjust happiness, up and down adjust energy. Hold Shift for larger steps."
          >
            <rect x="0" y="0" width={SIZE} height={SIZE} fill="transparent" />
            <line x1={SIZE/2} y1="0" x2={SIZE/2} y2={SIZE} stroke="var(--accent)" strokeOpacity="0.15" strokeDasharray="4 4" />
            <line x1="0" y1={SIZE/2} x2={SIZE} y2={SIZE/2} stroke="var(--accent)" strokeOpacity="0.15" strokeDasharray="4 4" />

            {(points || []).map((p, i) => (
              <circle
                key={p.id || i}
                cx={p.valence * SIZE}
                cy={(1 - p.energy) * SIZE}
                r="4"
                fill="var(--ink-2)"
                fillOpacity="0.45"
              >
                <title>{p.name}{p.artists && p.artists.length ? " · " + p.artists.join(", ") : ""}</title>
              </circle>
            ))}

            {point && (
              <g aria-hidden="true">
                <circle
                  cx={point.valence * SIZE}
                  cy={(1 - point.energy) * SIZE}
                  r="9"
                  fill="var(--accent)"
                  fillOpacity="0.25"
                  stroke="var(--accent)"
                  strokeWidth="2"
                />
                <line
                  x1={point.valence * SIZE - 14} y1={(1 - point.energy) * SIZE}
                  x2={point.valence * SIZE + 14} y2={(1 - point.energy) * SIZE}
                  stroke="var(--accent)" strokeWidth="1"
                />
                <line
                  x1={point.valence * SIZE} y1={(1 - point.energy) * SIZE - 14}
                  x2={point.valence * SIZE} y2={(1 - point.energy) * SIZE + 14}
                  stroke="var(--accent)" strokeWidth="1"
                />
              </g>
            )}

            {kPos && (
              <g aria-hidden="true">
                <circle
                  cx={kPos.valence * SIZE}
                  cy={(1 - kPos.energy) * SIZE}
                  r="7"
                  fill="none"
                  stroke="var(--accent)"
                  strokeWidth="1.5"
                  strokeDasharray="3 2"
                  opacity="0.8"
                />
              </g>
            )}

            {point && pointLabel && (
              <text
                x={Math.min(point.valence * SIZE + 14, SIZE - 90)}
                y={Math.max((1 - point.energy) * SIZE + 16, 14)}
                fill="var(--accent)"
                fontSize="10"
                fontFamily="'JetBrains Mono', monospace"
                opacity="0.85"
                pointerEvents="none"
                aria-hidden="true"
              >{pointLabel}</text>
            )}
          </svg>
        </div>
      );
    }


    function MoodTab() {
      const [genre, setGenre] = useState(null);
      const [point, setPoint] = useState(null);
      const [seed, setSeed] = useState([]);
      const [seedLoading, setSeedLoading] = useState(true);
      const [results, setResults] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [demoMode, setDemoMode] = useState(false);
      const [announcement, setAnnouncement] = useState("");
      const [uploadResult, setUploadResult] = useState(null);
      const [uploadLoading, setUploadLoading] = useState(false);
      const [uploadError, setUploadError] = useState(null);
      const fileInputRef = useRef(null);

      async function loadSeed(g) {
        setSeedLoading(true);
        try {
          const url = g ? `/api/genre/seed?genre=${encodeURIComponent(g)}` : "/api/mood/seed";
          const j = await safeFetch(url);
          setSeed(j.points || []);
          setDemoMode(false);
        } catch (err) {
          if (err.demo) { setSeed(DEMO_SEED); setDemoMode(true); }
        } finally { setSeedLoading(false); }
      }

      useEffect(() => { loadSeed(null); }, []);

      function handleGenreSelect(g) {
        setGenre(g);
        setPoint(null);
        setResults(null);
        setError(null);
        setUploadResult(null);
        setUploadError(null);
        loadSeed(g);
      }

      function handleUploadClick() {
        fileInputRef.current?.click();
      }

      async function handleFileChange(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        e.target.value = "";
        setUploadLoading(true);
        setUploadError(null);
        setUploadResult(null);
        setGenre(null);
        setPoint(null);
        setResults(null);
        setError(null);
        setAnnouncement("Analyzing your track…");

        const formData = new FormData();
        formData.append("file", file);
        try {
          const r = await fetch("/api/upload/analyze", { method: "POST", body: formData });
          if (!r.ok) {
            const j = await r.json().catch(() => ({}));
            const err = new Error(j.error || `HTTP ${r.status}`);
            err.status = r.status;
            throw err;
          }
          const result = await r.json();
          setUploadResult(result);
          await searchAt({ valence: result.valence, energy: result.energy });
        } catch (err) {
          setUploadError(err.message || "Upload analysis failed.");
          setAnnouncement("Upload failed.");
        } finally {
          setUploadLoading(false);
        }
      }

      async function searchAt(p) {
        setPoint(p);
        setLoading(true); setError(null);
        setAnnouncement("Loading tracks…");
        const url = genre
          ? `/api/genre?genre=${encodeURIComponent(genre)}&valence=${p.valence.toFixed(3)}&energy=${p.energy.toFixed(3)}&count=10`
          : `/api/mood?valence=${p.valence.toFixed(3)}&energy=${p.energy.toFixed(3)}&count=10`;
        try {
          const j = await safeFetch(url);
          setResults(j);
          setDemoMode(false);
          const n = (j.recommendations || []).length;
          setAnnouncement(n === 0 ? "No tracks found near this mood." : `Found ${n} track${n === 1 ? "" : "s"} near this mood.`);
        } catch (err) {
          if (err.demo) {
            setResults({
              target: p,
              recommendations: DEMO_TRACKS.slice(0, 5).map((t, i) => ({
                ...t, id: "m"+i,
                features: { valence: DEMO_FEAT[i].valence, energy: DEMO_FEAT[i].energy, tempo: DEMO_FEAT[i].tempo, danceability: DEMO_FEAT[i].danceability },
              })),
              candidate_count: 5,
            });
            setDemoMode(true);
            setAnnouncement("Showing sample data. Server unreachable.");
          } else {
            const msg = friendlyError(err);
            setError(msg);
            setAnnouncement(`Error: ${msg}`);
          }
        } finally { setLoading(false); }
      }

      const coordText = point
        ? uploadResult
          ? <span>Your track · <b>valence {point.valence.toFixed(2)}</b> · <b>energy {point.energy.toFixed(2)}</b></span>
          : <span>Picked <b>valence {point.valence.toFixed(2)}</b> · <b>energy {point.energy.toFixed(2)}</b></span>
        : <span>Click anywhere on the plane to search{genre ? ` in ${genre}` : " a mood"}, or <b>↑ upload</b> a track.</span>;

      return (
        <section>
          <div className="sr-only" aria-live="polite" aria-atomic="true">{announcement}</div>

          <div className="hero">
            <div className="eyebrow">Mood</div>
            <h1 className="display">Pick a <em>mood</em>, find tracks.</h1>
            <p className="lede">Choose a genre to plot its tracks, then click anywhere on the plane: we surface the closest matches by valence and energy via ReccoBeats.</p>
          </div>

          {demoMode && (
            <div className="demo-banner" role="alert">
              <span className="demo-dot" aria-hidden="true" />
              Sample data only · server unreachable. Results below are not real.
            </div>

          <div className="genre-section">
            <div className="genre-label">Genre</div>
            <div className="chips">
              {GENRES.map(g => (
                <button
                  key={g.label}
                  className={"chip" + (genre === g.query && !uploadResult ? " active" : "")}
                  onClick={() => handleGenreSelect(g.query)}
                  aria-pressed={genre === g.query && !uploadResult}
                >
                  {g.label}
                </button>
              ))}
              <button
                className={"chip" + (uploadResult ? " active" : "")}
                onClick={handleUploadClick}
                disabled={uploadLoading}

                {uploadLoading
                  ? "Analyzing…"

                    ? "↑ " + (uploadResult.filename.length > 18 ? uploadResult.filename.slice(0, 16) + "…" : uploadResult.filename)

              <input
                ref={fileInputRef}
                type="file"
                accept="audio/*,.mp3,.wav,.flac,.ogg,.m4a"
                style={{display: "none"}}

              />
            </div>

          <div className="mood-wrap">
            <div className="plane-wrap">

                point={point}

                  Loading {genre || "pool"}…

                  <div className="upload-card-feat">

                  </div>
                </div>

              {uploadError && (
                <div className="error" style={{padding: "6px 0"}}>{uploadError}</div>

              <div className="mood-presets">
                {MOOD_PRESETS.map(p => (
                  <button key={p.label} className="mood-preset" onClick={() => searchAt({ valence: p.v, energy: p.e })}>
                    {p.label}
                  </button>
                ))}
              </div>
              {results && (
                <div className="info--compact">
                  Showing <span className="mono">{(results.recommendations || []).length}</span> nearby tracks of <span className="mono">{results.candidate_count || 0}</span> candidates.
                </div>
              )}
            </div>
          </div>

          {error && (
            <div className="error-wrap" role="alert">
              <span className="error-msg">{error}</span>
              {point && (
                <button className="error-retry" onClick={() => searchAt(point)}>Try again</button>
              )}
            </div>
          )}
          {loading && <SkeletonList n={4} />}
          {!loading && results && (
            <>
              <h2>Tracks near this mood <span className="count">· {results.recommendations.length}</span></h2>
              {results.recommendations.length === 0
                ? (
                  <div className="empty">
                    No tracks found near that point.
                    <div className="empty-presets">
                      {MOOD_PRESETS.map(p => (
                        <button key={p.label} className="mood-preset" onClick={() => searchAt({ valence: p.v, energy: p.e })}>
                          {p.label}
                        </button>
                      ))}
                    </div>
                  </div>
                )
                : (
                  <div className="results">
                    {results.recommendations.map((t, i) => <TrackRow key={t.id || i} t={t} i={i} showFeatures demoMode={demoMode} />)}
                  </div>
                )}
            </>
          )}
        </section>
      );
    }

    function TrackRow({ t, i, showFeatures, demoMode, highlight }) {
      const f = t.features || {};
      const featurePieces = [];
      if (f.tempo)        featurePieces.push(<span key="t"><b>{f.tempo}</b> BPM</span>);
      if (f.key != null)  featurePieces.push(<span key="k"><b>{keyLabel(f.key, f.mode)}</b></span>);
      if (f.energy != null)       featurePieces.push(<span key="e">energy <b>{f.energy}</b></span>);
      if (f.danceability != null) featurePieces.push(<span key="d">dance <b>{f.danceability}</b></span>);
      if (f.valence != null)      featurePieces.push(<span key="v">valence <b>{f.valence}</b></span>);
      if (f.acousticness != null) featurePieces.push(<span key="a">acoustic <b>{f.acousticness}</b></span>);

      return (
        <div className={"track" + (highlight ? " highlight" : "")}>
          <div className="idx">{highlight ? "★" : String(i+1).padStart(2,"0")}</div>
          {t.image ? <img src={t.image} alt="" className="art" /> : <div className="ph-art" aria-hidden="true" />}
          <div className="body">
            <div className="name">{t.name}</div>
            <div className="meta">
              {Array.isArray(t.artists) ? t.artists.join(", ") : t.artists}
              {t.album ? <span className="album"> · {t.album}</span> : null}
            </div>
            {showFeatures && featurePieces.length > 0 && (
              <div className="features">
                {featurePieces.flatMap((el, idx) =>
                  idx === 0 ? [el] : [<span key={"s"+idx} className="sep">·</span>, el]
                )}
              </div>
            )}
          </div>
          {t.url && !demoMode && <a className="open" href={t.url} target="_blank" rel="noreferrer">Open ↗</a>}
        </div>
      );
    }

    function SkeletonList({ n = 4, withFeatures = false }) {
      return (
        <div className="results" aria-hidden="true">
          {Array.from({length: n}).map((_, i) => (
            <div key={i} className="track" style={{pointerEvents: "none"}}>
              <div className="idx mono">{String(i+1).padStart(2,"0")}</div>
              <div className="skel" style={{width: 60, height: 60, borderRadius: 10}} />
              <div className="body" style={{display: "flex", flexDirection: "column", gap: 6}}>
                <div className="skel" style={{height: 14, width: "55%"}} />
                <div className="skel" style={{height: 12, width: "35%"}} />
                {withFeatures && <div className="skel" style={{height: 10, width: "70%"}} />}
              </div>
              <div className="skel" style={{width: 56, height: 22, borderRadius: 6}} />
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
