<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tonecard · mood discovery</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <script>
    (function() {
      try {
        var saved = localStorage.getItem("tonecard-theme");
        var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg:       #F4F2EC;
      --bg-2:     #ECE9E1;
      --surface:  #FFFFFF;
      --ink:      #111418;
      --ink-2:    #2B3038;
      --ink-3:    #4A5159;
      --muted:    #7A818A;
      --line:     #D9D5CB;
      --line-2:   #C6C2B6;
      --accent:   #0F7F86;
      --accent-2: #14A5AE;
      --accent-soft: #D9EEEE;
      --accent-ink:  #094C50;
      --warn:     #B5451B;
      --focus-ring: rgba(15, 127, 134, 0.28);
      --r-xs: 4px;
      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 16px;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg:       #0B0E11;
      --bg-2:     #131820;
      --surface:  #1A2029;
      --ink:      #ECEEF1;
      --ink-2:    #C8CCD2;
      --ink-3:    #969BA3;
      --muted:    #6E747D;
      --line:     #232A33;
      --line-2:   #2D3540;
      --accent:   #3FD3DC;
      --accent-2: #6DE6EC;
      --accent-soft: #0F3033;
      --accent-ink:  #8CEFF4;
      --warn:     #E8845D;
      --focus-ring: rgba(63, 211, 220, 0.28);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.005em;
    }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-feature-settings: "tnum"; }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 36px 96px;
    }
    @media (max-width: 720px) {
      .shell { padding: 20px 18px 64px; }
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 4px 0 22px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 0;
      background: var(--ink);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 3px;
      border: 1px solid var(--bg);
      border-radius: 0;
      pointer-events: none;
    }
    .brand small {
      color: var(--muted);
      font-weight: 400;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-left: 4px;
    }

    .spacer { flex: 1; }

    .build-tag {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-right: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .build-tag::before {
      content: "";
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 999px;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    @media (max-width: 560px) { .build-tag { display: none; } }

    .theme-toggle {
      appearance: none;
      width: 32px;
      height: 32px;
      display: inline-grid;
      place-items: center;
      background: transparent;
      color: var(--ink-2);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
    }
    .theme-toggle:hover { color: var(--ink); border-color: var(--ink-3); }
    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .theme-toggle svg { width: 14px; height: 14px; display: block; }

    .hero { margin-bottom: 28px; max-width: 760px; }
    .eyebrow {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 18px; height: 1px;
      background: var(--accent);
    }
    h1.display {
      font-family: "Space Grotesk", inherit;
      font-weight: 500;
      letter-spacing: -0.035em;
      font-size: clamp(34px, 4.6vw, 52px);
      line-height: 1.04;
      margin: 0 0 12px;
      color: var(--ink);
    }
    h1.display strong {
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.035em;
    }
    .lede { color: var(--ink-3); font-size: 16px; max-width: 60ch; margin: 0; }

    h2 {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-2);
      margin: 32px 0 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    h2::before {
      content: "";
      flex-shrink: 0;
      width: 6px; height: 6px;
      background: var(--accent);
    }
    h2 .count {
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.04em;
      font-size: 11px;
      margin-left: auto;
      text-transform: none;
    }

    .results { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
    .track {
      display: grid;
      grid-template-columns: 36px 56px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg);
      transition: background 120ms ease;
    }
    .track:hover { background: var(--bg-2); }
    .track .idx {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-align: left;
      letter-spacing: 0.04em;
    }
    .track .art {
      width: 56px; height: 56px;
      border-radius: var(--r-sm);
      background: var(--bg-2);
      object-fit: cover;
      border: 1px solid var(--line);
    }
    .ph-art {
      width: 56px; height: 56px;
      border-radius: var(--r-sm);
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, transparent 0 45%, var(--line-2) 45% 55%, transparent 55%),
        var(--bg-2);
    }
    .track .body { min-width: 0; }
    .track .name {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track .meta {
      color: var(--ink-3);
      font-size: 13px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track .album { color: var(--muted); }
    .track .features {
      margin-top: 6px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.02em;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
    }
    .track .features span b { font-weight: 500; color: var(--ink-2); }
    .track .features span.sep { color: var(--line-2); }
    .track .open {
      color: var(--ink-3);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: var(--r-xs);
      border: 1px solid var(--line);
      background: var(--bg);
      transition: color 120ms, border-color 120ms, background 120ms;
      white-space: nowrap;
    }
    .track .open:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .track .open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 11px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: var(--r-xs);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-3);
      cursor: pointer;
      transition: color 120ms, border-color 120ms, background 120ms;
    }
    .chip:hover { color: var(--ink); border-color: var(--ink-3); }
    .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .empty, .info, .error {
      padding: 16px 4px;
      color: var(--muted);
      font-size: 14px;
    }
    .error { color: var(--warn); }
    .info code {
      background: var(--bg-2);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    .info--compact { padding: 0; color: var(--muted); font-size: 12px; font-family: "IBM Plex Mono", monospace; letter-spacing: 0.02em; }
    .empty-presets { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }

    .error-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px;
      border: 1px solid var(--warn);
      background: color-mix(in srgb, var(--warn) 8%, transparent);
      border-radius: var(--r-sm);
      flex-wrap: wrap;
      margin: 8px 0;
    }
    .error-msg { color: var(--warn); font-size: 13px; font-family: "IBM Plex Mono", monospace; }
    .error-retry {
      appearance: none;
      background: transparent;
      border: 1px solid var(--warn);
      color: var(--warn);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: var(--r-xs);
      cursor: pointer;
      transition: background 120ms, color 120ms;
    }
    .error-retry:hover { background: var(--warn); color: var(--bg); }
    .error-retry:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }

    .skel {
      background: linear-gradient(90deg, var(--bg-2) 0%, var(--line) 50%, var(--bg-2) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
      border-radius: 4px;
    }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) {
      .skel { animation: none; }
      .track, .chip, .mood-preset, .theme-toggle, .track .open, .error-retry { transition: none; }
    }

    .demo-banner {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 9px 14px;
      background: var(--accent-soft);
      color: var(--accent-ink);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--r-xs) var(--r-xs) 0;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .demo-dot { width: 6px; height: 6px; background: var(--accent); flex-shrink: 0; }

    .mood-wrap {
      display: grid;
      grid-template-columns: minmax(0, 420px) 1fr;
      gap: 28px;
      align-items: start;
      margin-bottom: 28px;
    }
    @media (max-width: 760px) {
      .mood-wrap { grid-template-columns: 1fr; }
    }
    .mood-plane {
      position: relative;
      aspect-ratio: 1;
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--line);
      border-radius: 0;
      background:
        linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 12.5%,
        linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 12.5% 100%,
        var(--bg);
      padding: 28px;
      box-sizing: border-box;
    }
    .mood-plane svg {
      width: 100%; height: 100%;
      display: block;
      cursor: crosshair;
      user-select: none;
    }
    .mood-plane svg:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .mood-axis-label {
      position: absolute;
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--muted);
      pointer-events: none;
    }
    .mood-axis-label.top    { top: 8px;    left: 50%; transform: translateX(-50%); }
    .mood-axis-label.bottom { bottom: 8px; left: 50%; transform: translateX(-50%); }
    .mood-axis-label.left   { left: 8px;   top: 50%;  transform: translateY(-50%) rotate(-90deg); transform-origin: left center; }
    .mood-axis-label.right  { right: 8px;  top: 50%;  transform: translateY(-50%) rotate(90deg);  transform-origin: right center; }
    .mood-axis-corner {
      position: absolute;
      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.04em;
      pointer-events: none;
    }
    .mood-axis-corner.tl { top: 6px; left: 8px; }
    .mood-axis-corner.tr { top: 6px; right: 8px; }
    .mood-axis-corner.bl { bottom: 6px; left: 8px; }
    .mood-axis-corner.br { bottom: 6px; right: 8px; }

    .plane-wrap { position: relative; }
    .seed-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mood-side {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }
    .mood-coord {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.02em;
      color: var(--ink-3);
      padding: 12px 14px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
    }
    .mood-coord b { color: var(--ink); font-weight: 600; }
    .mood-presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .mood-preset {
      appearance: none;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink-3);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.02em;
      padding: 5px 9px;
      border-radius: var(--r-xs);
      cursor: pointer;
      transition: color 120ms, border-color 120ms, background 120ms;
    }
    .mood-preset:hover { color: var(--ink); border-color: var(--accent); background: var(--accent-soft); }
    .mood-preset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .genre-section { margin-bottom: 22px; }
    .genre-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 500;
    }

    .tab-bar {
      display: flex;
      gap: 0;
      margin-bottom: 32px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 3px;
      background: var(--bg-2);
      width: fit-content;
    }
    .tab {
      appearance: none;
      background: transparent;
      border: none;
      padding: 8px 18px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: color 120ms, background 120ms;
      border-radius: var(--r-xs);
    }
    .tab:hover { color: var(--ink); }
    .tab.tab-active { color: var(--ink); background: var(--bg); box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .search-form {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      background: var(--surface);
      transition: border-color 120ms, box-shadow 120ms;
    }
    :root[data-theme="dark"] .search-form { background: var(--bg-2); }
    .search-form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
    .search-input {
      flex: 1;
      appearance: none;
      font-family: inherit;
      font-size: 15px;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--ink);
      min-width: 0;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { outline: none; }
    .search-btn {
      appearance: none;
      background: var(--ink);
      color: var(--bg);
      border: none;
      border-radius: var(--r-xs);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: 9px 18px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 120ms;
    }
    .search-btn:hover { background: var(--accent); color: var(--bg); }
    .search-btn:disabled { opacity: 0.40; cursor: not-allowed; background: var(--ink); }
    .search-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .search-found { margin-bottom: 20px; }
    .search-found-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .search-found-label::before {
      content: "";
      width: 14px; height: 1px;
      background: var(--accent);
    }
    .track.highlight {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding-left: 13px;
    }
    .track.highlight .idx { color: var(--accent); }
    .track.highlight .name { color: var(--accent-ink); }
    :root[data-theme="dark"] .track.highlight .name { color: var(--accent-ink); }

    .upload-card {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .upload-card-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .upload-card-feat {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .upload-card-feat b { color: var(--ink-2); font-weight: 500; }

    .mode-toggle { margin-bottom: 20px; }

    .artist-card {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      padding: 18px 20px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      margin-bottom: 24px;
    }
    .artist-avatar {
      width: 88px; height: 88px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--line);
      background: var(--bg-2);
    }
    .ph-avatar {
      width: 88px; height: 88px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, var(--bg-2) 0%, var(--line) 100%);
    }
    .artist-body { min-width: 0; flex: 1; }
    .artist-name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: var(--ink);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .artist-genres {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.02em;
      color: var(--ink-3);
      margin-bottom: 8px;
    }
    .artist-stats {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .artist-stats b { color: var(--ink-2); font-weight: 500; }

    .trending-section { margin-bottom: 24px; }
    .trending-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .trending-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .trending-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px 5px 5px;
      border-radius: 99px;
      border: 1px solid var(--line);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      color: var(--ink);
      transition: background 120ms, border-color 120ms;
      text-align: left;
    }
    .trending-pill:hover { background: var(--surface); border-color: var(--ink-3); }
    .trending-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .trending-pill-img {
      width: 28px; height: 28px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--line);
    }
    .trending-pill-ph {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--line);
      flex-shrink: 0;
    }
    .trending-pill-name {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    .foot {
      margin-top: 56px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .foot a { color: var(--ink-3); text-decoration: none; }
    .foot a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    const KEY_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
    const keyLabel = (k, mode) => {
      if (k == null) return "";
      const name = KEY_NAMES[k] || "?";
      return mode === 0 ? name + "m" : name;
    };

    function friendlyError(err) {
      if (!err) return "Search failed.";
      if (err.status === 429) return "Throttled — wait a beat and try again.";
      if (err.status === 503 || err.status === 502) return "Server's catching its breath. Reload and try again.";
      if (err.status >= 500) return "Something snapped on our end. Reload and try again.";
      if (err.status === 404) return "Nothing here by that name.";
      return err.message || "Probe failed.";
    }

    const DEMO_TRACKS = [
      { name: "Ekstasis", artists: ["Julianna Barwick"], album: "Nepenthe", popularity: 41, image: null, url: null },
      { name: "Avril 14th", artists: ["Aphex Twin"], album: "Drukqs", popularity: 68, image: null, url: null },
      { name: "Cirrus", artists: ["Bonobo"], album: "The North Borders", popularity: 64, image: null, url: null },
      { name: "Open Eye Signal", artists: ["Jon Hopkins"], album: "Immunity", popularity: 59, image: null, url: null },
      { name: "An Ending (Ascent)", artists: ["Brian Eno"], album: "Apollo", popularity: 70, image: null, url: null },
      { name: "Saada Bonaire", artists: ["Saada Bonaire"], album: "1992", popularity: 33, image: null, url: null },
    ];
    const DEMO_FEAT = [
      { tempo: 92.4,  key: 9, mode: 1, energy: 0.42, danceability: 0.51, valence: 0.34, acousticness: 0.78 },
      { tempo: 138.0, key: 5, mode: 0, energy: 0.18, danceability: 0.21, valence: 0.16, acousticness: 0.99 },
      { tempo: 110.5, key: 2, mode: 0, energy: 0.62, danceability: 0.59, valence: 0.41, acousticness: 0.07 },
      { tempo: 124.0, key: 7, mode: 1, energy: 0.81, danceability: 0.74, valence: 0.55, acousticness: 0.04 },
      { tempo: 76.2,  key: 4, mode: 1, energy: 0.22, danceability: 0.28, valence: 0.62, acousticness: 0.92 },
      { tempo: 118.0, key: 0, mode: 1, energy: 0.55, danceability: 0.66, valence: 0.71, acousticness: 0.31 },
    ];

    const DEMO_SEED = [
      { id: "h1", name: "Avril 14th",        artists: ["Aphex Twin"],   valence: 0.18, energy: 0.18 },
      { id: "h2", name: "An Ending (Ascent)",artists: ["Brian Eno"],    valence: 0.35, energy: 0.18 },
      { id: "h3", name: "Cirrus",            artists: ["Bonobo"],       valence: 0.52, energy: 0.62 },
      { id: "h4", name: "Open Eye Signal",   artists: ["Jon Hopkins"],  valence: 0.55, energy: 0.81 },
      { id: "h5", name: "Ekstasis",          artists: ["J. Barwick"],   valence: 0.34, energy: 0.42 },
      { id: "h6", name: "Saada Bonaire",     artists: ["Saada Bonaire"],valence: 0.71, energy: 0.55 },
    ];

    const GENRES = [
      { label: "All moods",  query: null },
      { label: "Pop",        query: "pop" },
      { label: "Hip-Hop",    query: "hip hop" },
      { label: "Rock",       query: "rock" },
      { label: "R&B",        query: "r&b" },
      { label: "Electronic", query: "electronic" },
      { label: "Jazz",       query: "jazz" },
      { label: "Classical",  query: "classical" },
      { label: "Latin",      query: "latin" },
      { label: "Punjabi",    query: "punjabi" },
      { label: "Metal",      query: "metal" },
      { label: "Country",    query: "country" },
      { label: "Indie",      query: "indie" },
    ];

    const MOOD_PRESETS = [
      { label: "Still + heavy",  v: 0.25, e: 0.20 },
      { label: "Still + bright", v: 0.75, e: 0.25 },
      { label: "Wired + heavy",  v: 0.20, e: 0.80 },
      { label: "Wired + bright", v: 0.80, e: 0.85 },
      { label: "Dead center",    v: 0.50, e: 0.50 },
    ];

    async function safeFetch(url, opts) {
      try {
        const r = await fetch(url, opts);
        if (!r.ok) {
          const j = await r.json().catch(() => ({}));
          const err = new Error(j.error || `HTTP ${r.status}`);
          err.status = r.status; err.body = j;
          throw err;
        }
        return await r.json();
      } catch (e) {
        if (e.status) throw e;
        e.demo = true;
        throw e;
      }
    }

    function App() {
      const [theme, setTheme] = useState(() =>
        document.documentElement.getAttribute("data-theme") || "light"
      );
      const [tab, setTab] = useState("mood");

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        try { localStorage.setItem("tonecard-theme", theme); } catch (e) {}
      }, [theme]);

      const toggleTheme = () => setTheme(t => (t === "dark" ? "light" : "dark"));

      return (
        <div className="shell">
          <header className="topbar">
            <div className="brand">
              <div className="brand-mark" aria-hidden="true"></div>
              <div>TONECARD <small>v0.4 · sound coordinates</small></div>
            </div>
            <div className="spacer"></div>
            <span className="build-tag">online · audio engine</span>
            <button
              className="theme-toggle"
              onClick={toggleTheme}
              aria-label={theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}
              title={theme === "dark" ? "Light mode" : "Dark mode"}
            >
              {theme === "dark"
                ? (
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
                  </svg>
                )
                : (
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                  </svg>
                )}
            </button>
          </header>

          <nav className="tab-bar" aria-label="View">
            <button
              className={"tab" + (tab === "mood" ? " tab-active" : "")}
              onClick={() => setTab("mood")}
              aria-current={tab === "mood" ? "page" : undefined}
            >Atlas</button>
            <button
              className={"tab" + (tab === "search" ? " tab-active" : "")}
              onClick={() => setTab("search")}
              aria-current={tab === "search" ? "page" : undefined}
            >Lookup</button>
          </nav>

          {tab === "mood" ? <MoodTab /> : <SearchTab />}

          <footer className="foot">
            <div>Signal · ReccoBeats / Spotify Web API</div>
            <div>Tonecard · cartography for songs</div>
          </footer>
        </div>
      );
    }

    const DEMO_ARTIST = {
      artist: {
        id: "demo-artist",
        name: "Brian Eno",
        genres: ["ambient", "art rock", "experimental"],
        popularity: 68,
        followers: 1520000,
        image: null,
        url: null,
      },
      tracks: DEMO_TRACKS.slice(0, 5).map((t, i) => ({
        ...t, id: "da" + i,
        features: { valence: DEMO_FEAT[i].valence, energy: DEMO_FEAT[i].energy, tempo: DEMO_FEAT[i].tempo, danceability: DEMO_FEAT[i].danceability },
      })),
      points: DEMO_SEED.slice(0, 5),
    };

    const DEMO_SEARCH = {
      track: {
        id: "demo-found", name: "Sample Track", artists: ["Demo Artist"],
        album: "Demo Album", popularity: 95, image: null, url: null,
        features: { valence: 0.335, energy: 0.730, tempo: 171.0, danceability: 0.514 },
      },
      genre: "demo pop",
      similar: DEMO_TRACKS.slice(0, 5).map((t, i) => ({
        ...t, id: "ds" + i,
        features: { valence: DEMO_FEAT[i].valence, energy: DEMO_FEAT[i].energy, tempo: DEMO_FEAT[i].tempo, danceability: DEMO_FEAT[i].danceability },
      })),
      pool_points: DEMO_SEED,
      candidate_count: 6,
    };

    const DEMO_TRENDING = [
      { id: "dt1",  name: "Taylor Swift",      genres: ["pop"],                   image: null, url: null },
      { id: "dt2",  name: "The Weeknd",         genres: ["canadian pop", "r&b"],   image: null, url: null },
      { id: "dt3",  name: "Bad Bunny",          genres: ["latin", "reggaeton"],    image: null, url: null },
      { id: "dt4",  name: "Drake",              genres: ["canadian pop", "hip hop"], image: null, url: null },
      { id: "dt5",  name: "Billie Eilish",      genres: ["pop"],                   image: null, url: null },
      { id: "dt6",  name: "SZA",                genres: ["r&b"],                   image: null, url: null },
      { id: "dt7",  name: "Kendrick Lamar",     genres: ["hip hop"],               image: null, url: null },
      { id: "dt8",  name: "Sabrina Carpenter",  genres: ["pop"],                   image: null, url: null },
      { id: "dt9",  name: "Post Malone",        genres: ["pop", "hip hop"],        image: null, url: null },
      { id: "dt10", name: "Dua Lipa",           genres: ["dance pop"],             image: null, url: null },
    ];

    function SearchTab() {
      const [mode, setMode] = useState("track");
      const [query, setQuery] = useState("");
      // track mode state
      const [result, setResult] = useState(null);
      const [similar, setSimilar] = useState([]);
      const [point, setPoint] = useState(null);
      const [similarLoading, setSimilarLoading] = useState(false);
      const [similarError, setSimilarError] = useState(null);
      // artist mode state
      const [artistResult, setArtistResult] = useState(null);
      const [trendingArtists, setTrendingArtists] = useState([]);
      const [trendingLoading, setTrendingLoading] = useState(false);
      // shared state
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [demoMode, setDemoMode] = useState(false);
      const [announcement, setAnnouncement] = useState("");

      useEffect(() => {
        if (mode !== "artist" || trendingArtists.length > 0) return;
        setTrendingLoading(true);
        safeFetch("/api/artists/trending")
          .then(data => setTrendingArtists(data.artists || []))
          .catch(err => { if (err.demo) setTrendingArtists(DEMO_TRENDING); })
          .finally(() => setTrendingLoading(false));
      }, [mode]);

      function switchMode(m) {
        setMode(m);
        setResult(null);
        setSimilar([]);
        setPoint(null);
        setSimilarError(null);
        setArtistResult(null);
        setError(null);
        setDemoMode(false);
      }

      async function doSearch(q) {
        if (!q.trim()) return;
        setLoading(true);
        setError(null);
        setSimilarError(null);
        setResult(null);
        setSimilar([]);
        setPoint(null);
        setArtistResult(null);
        setAnnouncement("Searching…");

        if (mode === "artist") {
          try {
            const data = await safeFetch(`/api/artist?q=${encodeURIComponent(q)}&count=10`);
            setArtistResult(data);
            setDemoMode(false);
            setAnnouncement(`Found: ${data.artist.name}`);
          } catch (err) {
            if (err.demo) {
              setArtistResult(DEMO_ARTIST);
              setDemoMode(true);
              setAnnouncement("Showing sample data. Server unreachable.");
            } else {
              setError(friendlyError(err));
              setAnnouncement(`Error: ${friendlyError(err)}`);
            }
          } finally {
            setLoading(false);
          }
          return;
        }

        try {
          const data = await safeFetch(`/api/search?q=${encodeURIComponent(q)}&count=10`);
          setResult(data);
          setSimilar(data.similar || []);
          setPoint({ valence: data.track.features.valence, energy: data.track.features.energy });
          setDemoMode(false);
          setAnnouncement(`Found: ${data.track.name}`);
        } catch (err) {
          if (err.demo) {
            setResult(DEMO_SEARCH);
            setSimilar(DEMO_SEARCH.similar);
            setPoint({ valence: DEMO_SEARCH.track.features.valence, energy: DEMO_SEARCH.track.features.energy });
            setDemoMode(true);
            setAnnouncement("Showing sample data. Server unreachable.");
          } else {
            setError(friendlyError(err));
            setAnnouncement(`Error: ${friendlyError(err)}`);
          }
        } finally {
          setLoading(false);
        }
      }

      async function pickOnPlane(p) {
        if (!result) return;
        setPoint(p);
        setSimilarLoading(true);
        setSimilarError(null);
        setAnnouncement("Loading tracks…");
        const url = result.genre
          ? `/api/genre?genre=${encodeURIComponent(result.genre)}&valence=${p.valence.toFixed(3)}&energy=${p.energy.toFixed(3)}&count=10`
          : `/api/mood?valence=${p.valence.toFixed(3)}&energy=${p.energy.toFixed(3)}&count=10`;
        try {
          const data = await safeFetch(url);
          setSimilar(data.recommendations || []);
          setDemoMode(false);
          const n = (data.recommendations || []).length;
          setAnnouncement(`Found ${n} track${n === 1 ? "" : "s"} near this point.`);
        } catch (err) {
          if (err.demo) {
            setSimilar(DEMO_SEARCH.similar);
            setDemoMode(true);
          } else {
            setSimilarError(friendlyError(err));
            setAnnouncement(`Error: ${friendlyError(err)}`);
          }
        } finally {
          setSimilarLoading(false);
        }
      }

      const atFoundTrack = result && point &&
        Math.abs(point.valence - result.track.features.valence) < 0.001 &&
        Math.abs(point.energy - result.track.features.energy) < 0.001;

      return (
        <section>
          <div className="sr-only" aria-live="polite" aria-atomic="true">{announcement}</div>

          <div className="hero">
            <div className="eyebrow">02 · Lookup</div>
            {mode === "artist"
              ? <><h1 className="display">Name an artist. <strong>Hear their world.</strong></h1>
                  <p className="lede">Search any artist and we'll map their top tracks on the mood plane with full audio coordinates.</p></>
              : <><h1 className="display">Name a song. <strong>Hear its kin.</strong></h1>
                  <p className="lede">Type any track. We fix its coordinates on the plane and pull back neighbors riding the same wavelength.</p></>
            }
          </div>

          {demoMode && (
            <div className="demo-banner" role="alert">
              <span className="demo-dot" aria-hidden="true" />
              Offline demo · server didn't answer
            </div>
          )}

          <div className="mode-toggle">
            <div className="chips">
              <button className={"chip" + (mode === "track" ? " active" : "")} onClick={() => switchMode("track")} aria-pressed={mode === "track"}>Track</button>
              <button className={"chip" + (mode === "artist" ? " active" : "")} onClick={() => switchMode("artist")} aria-pressed={mode === "artist"}>Artist</button>
            </div>
          </div>

          <form className="search-form" onSubmit={e => { e.preventDefault(); doSearch(query); }}>
            <input
              className="search-input"
              type="search"
              placeholder={mode === "artist" ? "Type an artist name…" : "Type a title or artist…"}
              value={query}
              onChange={e => setQuery(e.target.value)}
              aria-label={mode === "artist" ? "Search for an artist" : "Search for a song"}
            />
            <button className="search-btn" type="submit" disabled={loading || !query.trim()}>
              {loading ? "Probing…" : "Probe"}
            </button>
          </form>

          {error && (
            <div className="error-wrap" role="alert">
              <span className="error-msg">{error}</span>
              <button className="error-retry" onClick={() => doSearch(query)}>Try again</button>
            </div>
          )}

          {mode === "artist" && !artistResult && !loading && (
            <div className="trending-section">
              <div className="trending-label">
                {trendingLoading ? "Loading…" : "Trending on Spotify"}
              </div>
              {!trendingLoading && trendingArtists.length > 0 && (
                <div className="trending-grid" role="list">
                  {trendingArtists.map(a => (
                    <button
                      key={a.id}
                      className="trending-pill"
                      role="listitem"
                      onClick={() => { setQuery(a.name); doSearch(a.name); }}
                    >
                      {a.image
                        ? <img src={a.image} alt="" className="trending-pill-img" />
                        : <div className="trending-pill-ph" aria-hidden="true" />
                      }
                      <span className="trending-pill-name">{a.name}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}

          {loading && <SkeletonList n={4} withFeatures />}

          {!loading && mode === "artist" && artistResult && (
            <ArtistView data={artistResult} demoMode={demoMode} />
          )}

          {!loading && mode === "track" && result && (
            <>
              <div className="search-found">
                <div className="search-found-label">Target</div>
                <div className="results">
                  <TrackRow t={result.track} i={-1} showFeatures demoMode={demoMode} highlight />
                </div>
              </div>

              <div className="mood-wrap">
                <div className="plane-wrap">
                  <MoodPlane
                    points={result.pool_points || []}
                    point={point}
                    pointLabel={atFoundTrack ? result.track.name : null}
                    onPick={pickOnPlane}
                  />
                </div>
                <div className="mood-side">
                  <div className="mood-coord">
                    {atFoundTrack
                      ? <span>Your track · v <b>{point.valence.toFixed(2)}</b> / e <b>{point.energy.toFixed(2)}</b></span>
                      : <span>Pinned · v <b>{point.valence.toFixed(2)}</b> / e <b>{point.energy.toFixed(2)}</b></span>
                    }
                  </div>
                  {result.genre && (
                    <div className="info--compact">pool · <span style={{color:"var(--ink-2)"}}>{result.genre}</span></div>
                  )}
                  <div className="info--compact">
                    showing <span style={{color:"var(--ink-2)"}}>{similar.length}</span> / <span style={{color:"var(--ink-2)"}}>{result.candidate_count}</span> candidates
                  </div>
                  <div className="info--compact" style={{color: "var(--muted)"}}>
                    drop a new pin to explore the genre.
                  </div>
                </div>
              </div>

              {similarError && (
                <div className="error-wrap" role="alert">
                  <span className="error-msg">{similarError}</span>
                </div>
              )}

              <h2>
                {atFoundTrack ? "In the neighborhood" : "Nearby on the plane"}
                {result.genre ? <span style={{color:"var(--muted)"}}> · {result.genre}</span> : null}
                <span className="count">{similar.length} results</span>
              </h2>

              {similarLoading && <SkeletonList n={4} withFeatures />}
              {!similarLoading && (
                similar.length === 0
                  ? <div className="empty">No tracks found near that point. Try clicking elsewhere on the plane.</div>
                  : <div className="results">
                      {similar.map((t, i) => <TrackRow key={t.id || i} t={t} i={i} showFeatures demoMode={demoMode} />)}
                    </div>
              )}
            </>
          )}
        </section>
      );
    }

    function ArtistView({ data, demoMode }) {
      const { artist, tracks, points } = data;
      return (
        <>
          <div className="artist-card">
            {artist.image
              ? <img src={artist.image} alt="" className="artist-avatar" />
              : <div className="ph-avatar" aria-hidden="true" />
            }
            <div className="artist-body">
              <div className="artist-name">{artist.name}</div>
              {artist.genres && artist.genres.length > 0 && (
                <div className="artist-genres">{artist.genres.slice(0, 4).join(" · ")}</div>
              )}
              <div className="artist-stats">
                <span>Popularity <b>{artist.popularity}</b></span>
                {artist.followers > 0 && (
                  <span><b>{artist.followers.toLocaleString()}</b> followers</span>
                )}
              </div>
              {artist.url && !demoMode && (
                <a className="open" href={artist.url} target="_blank" rel="noreferrer">Open on Spotify ↗</a>
              )}
            </div>
          </div>

          {points.length > 0 && (
            <div className="mood-wrap">
              <div className="plane-wrap">
                <MoodPlane points={points} point={null} pointLabel={null} onPick={null} />
              </div>
              <div className="mood-side">
                <div className="mood-coord">
                  <span><b>{artist.name}</b> on the plane</span>
                </div>
                <div className="info--compact">
                  {points.length} track{points.length !== 1 ? "s" : ""} with mood data
                </div>
                <div className="info--compact" style={{color:"var(--muted)"}}>
                  each dot is one of their top tracks.
                </div>
              </div>
            </div>
          )}

          <h2>
            Top Tracks
            <span className="count">{tracks.length} results</span>
          </h2>
          {tracks.length === 0
            ? <div className="empty">No tracks found.</div>
            : <div className="results">
                {tracks.map((t, i) => <TrackRow key={t.id || i} t={t} i={i} showFeatures demoMode={demoMode} />)}
              </div>
          }
        </>
      );
    }

    function MoodPlane({ points, point, pointLabel, onPick }) {
      const SIZE = 360;
      const STEP = 0.05;
      const BIG_STEP = 0.20;
      const [kPos, setKPos] = useState(null);

      function handleClick(e) {
        if (!onPick) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;
        const valence = Math.max(0, Math.min(1, x));
        const energy  = Math.max(0, Math.min(1, 1 - y));
        setKPos(null);
        onPick({ valence, energy });
      }

      function handleFocus() {
        if (!kPos) setKPos(point || { valence: 0.5, energy: 0.5 });
      }

      function handleBlur() {
        setKPos(null);
      }

      function handleKeyDown(e) {
        const cur = kPos || point || { valence: 0.5, energy: 0.5 };
        const step = e.shiftKey ? BIG_STEP : STEP;
        let { valence, energy } = cur;

        switch (e.key) {
          case "ArrowRight": valence = Math.min(1, +(valence + step).toFixed(3)); break;
          case "ArrowLeft":  valence = Math.max(0, +(valence - step).toFixed(3)); break;
          case "ArrowUp":    energy  = Math.min(1, +(energy  + step).toFixed(3)); break;
          case "ArrowDown":  energy  = Math.max(0, +(energy  - step).toFixed(3)); break;
          case "Enter":
          case " ":
            if (kPos) onPick(kPos);
            e.preventDefault();
            return;
          default: return;
        }
        e.preventDefault();
        setKPos({ valence, energy });
      }

      return (
        <div className="mood-plane">
          <div className="mood-axis-corner tl" aria-hidden="true">0,1</div>
          <div className="mood-axis-corner tr" aria-hidden="true">1,1</div>
          <div className="mood-axis-corner bl" aria-hidden="true">0,0</div>
          <div className="mood-axis-corner br" aria-hidden="true">1,0</div>
          <div className="mood-axis-label top" aria-hidden="true">↑ Charged</div>
          <div className="mood-axis-label bottom" aria-hidden="true">↓ Still</div>
          <div className="mood-axis-label left" aria-hidden="true">← Heavy</div>
          <div className="mood-axis-label right" aria-hidden="true">→ Bright</div>
          <svg
            viewBox={`0 0 ${SIZE} ${SIZE}`}
            onClick={handleClick}
            onKeyDown={onPick ? handleKeyDown : undefined}
            onFocus={onPick ? handleFocus : undefined}
            onBlur={onPick ? handleBlur : undefined}
            tabIndex={onPick ? 0 : -1}
            role={onPick ? "application" : "img"}
            aria-label={onPick ? "Mood plane. Use arrow keys to move the cursor, Enter or Space to search. Left and right adjust happiness, up and down adjust energy. Hold Shift for larger steps." : "Mood plane showing track positions"}
            style={onPick ? {} : {cursor: "default"}}
          >
            <rect x="0" y="0" width={SIZE} height={SIZE} fill="transparent" />
            <line x1={SIZE/2} y1="0" x2={SIZE/2} y2={SIZE} stroke="var(--accent)" strokeOpacity="0.20" strokeDasharray="2 4" />
            <line x1="0" y1={SIZE/2} x2={SIZE} y2={SIZE/2} stroke="var(--accent)" strokeOpacity="0.20" strokeDasharray="2 4" />

            {(points || []).map((p, i) => (
              <circle
                key={p.id || i}
                cx={p.valence * SIZE}
                cy={(1 - p.energy) * SIZE}
                r="3.5"
                fill="var(--ink-3)"
                fillOpacity="0.55"
              >
                <title>{p.name}{p.artists && p.artists.length ? " · " + p.artists.join(", ") : ""}</title>
              </circle>
            ))}

            {point && (
              <g aria-hidden="true">
                <circle
                  cx={point.valence * SIZE}
                  cy={(1 - point.energy) * SIZE}
                  r="10"
                  fill="var(--accent)"
                  fillOpacity="0.15"
                  stroke="var(--accent)"
                  strokeWidth="1.5"
                />
                <line
                  x1={point.valence * SIZE - 16} y1={(1 - point.energy) * SIZE}
                  x2={point.valence * SIZE + 16} y2={(1 - point.energy) * SIZE}
                  stroke="var(--accent)" strokeWidth="1"
                />
                <line
                  x1={point.valence * SIZE} y1={(1 - point.energy) * SIZE - 16}
                  x2={point.valence * SIZE} y2={(1 - point.energy) * SIZE + 16}
                  stroke="var(--accent)" strokeWidth="1"
                />
                <circle
                  cx={point.valence * SIZE}
                  cy={(1 - point.energy) * SIZE}
                  r="2"
                  fill="var(--accent)"
                />
              </g>
            )}

            {kPos && (
              <g aria-hidden="true">
                <circle
                  cx={kPos.valence * SIZE}
                  cy={(1 - kPos.energy) * SIZE}
                  r="8"
                  fill="none"
                  stroke="var(--accent)"
                  strokeWidth="1.5"
                  strokeDasharray="3 2"
                  opacity="0.8"
                />
              </g>
            )}

            {point && pointLabel && (
              <text
                x={Math.min(point.valence * SIZE + 16, SIZE - 90)}
                y={Math.max((1 - point.energy) * SIZE + 18, 14)}
                fill="var(--accent)"
                fontSize="10"
                fontFamily="'IBM Plex Mono', monospace"
                opacity="0.95"
                pointerEvents="none"
                aria-hidden="true"
              >{pointLabel}</text>
            )}
          </svg>
        </div>
      );
    }

    function MoodTab() {
      const [genre, setGenre] = useState(null);
      const [point, setPoint] = useState(null);
      const [seed, setSeed] = useState([]);
      const [seedLoading, setSeedLoading] = useState(true);
      const [results, setResults] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [demoMode, setDemoMode] = useState(false);
      const [announcement, setAnnouncement] = useState("");
      const [uploadResult, setUploadResult] = useState(null);
      const [uploadLoading, setUploadLoading] = useState(false);
      const [uploadError, setUploadError] = useState(null);
      const fileInputRef = useRef(null);

      async function loadSeed(g) {
        setSeedLoading(true);
        try {
          const url = g ? `/api/genre/seed?genre=${encodeURIComponent(g)}` : "/api/mood/seed";
          const j = await safeFetch(url);
          setSeed(j.points || []);
          setDemoMode(false);
        } catch (err) {
          if (err.demo) { setSeed(DEMO_SEED); setDemoMode(true); }
        } finally { setSeedLoading(false); }
      }

      useEffect(() => { loadSeed(null); }, []);

      function handleGenreSelect(g) {
        setGenre(g);
        setPoint(null);
        setResults(null);
        setError(null);
        setUploadResult(null);
        setUploadError(null);
        loadSeed(g);
      }

      function handleUploadClick() {
        fileInputRef.current?.click();
      }

      async function handleFileChange(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        e.target.value = "";
        setUploadLoading(true);
        setUploadError(null);
        setUploadResult(null);
        setGenre(null);
        setPoint(null);
        setResults(null);
        setError(null);
        setAnnouncement("Analyzing your track…");

        const formData = new FormData();
        formData.append("file", file);
        try {
          const r = await fetch("/api/upload/analyze", { method: "POST", body: formData });
          if (!r.ok) {
            const j = await r.json().catch(() => ({}));
            const err = new Error(j.error || `HTTP ${r.status}`);
            err.status = r.status;
            throw err;
          }
          const result = await r.json();
          setUploadResult(result);
          await searchAt({ valence: result.valence, energy: result.energy });
        } catch (err) {
          setUploadError(err.message || "Upload analysis failed.");
          setAnnouncement("Upload failed.");
        } finally {
          setUploadLoading(false);
        }
      }

      async function searchAt(p) {
        setPoint(p);
        setLoading(true); setError(null);
        setAnnouncement("Loading tracks…");
        const url = genre
          ? `/api/genre?genre=${encodeURIComponent(genre)}&valence=${p.valence.toFixed(3)}&energy=${p.energy.toFixed(3)}&count=10`
          : `/api/mood?valence=${p.valence.toFixed(3)}&energy=${p.energy.toFixed(3)}&count=10`;
        try {
          const j = await safeFetch(url);
          setResults(j);
          setDemoMode(false);
          const n = (j.recommendations || []).length;
          setAnnouncement(n === 0 ? "No tracks found near this mood." : `Found ${n} track${n === 1 ? "" : "s"} near this mood.`);
        } catch (err) {
          if (err.demo) {
            setResults({
              target: p,
              recommendations: DEMO_TRACKS.slice(0, 5).map((t, i) => ({
                ...t, id: "m"+i,
                features: { valence: DEMO_FEAT[i].valence, energy: DEMO_FEAT[i].energy, tempo: DEMO_FEAT[i].tempo, danceability: DEMO_FEAT[i].danceability },
              })),
              candidate_count: 5,
            });
            setDemoMode(true);
            setAnnouncement("Showing sample data. Server unreachable.");
          } else {
            const msg = friendlyError(err);
            setError(msg);
            setAnnouncement(`Error: ${msg}`);
          }
        } finally { setLoading(false); }
      }

      const coordText = point
        ? uploadResult
          ? <span>Your track · v <b>{point.valence.toFixed(2)}</b> / e <b>{point.energy.toFixed(2)}</b></span>
          : <span>Pinned · v <b>{point.valence.toFixed(2)}</b> / e <b>{point.energy.toFixed(2)}</b></span>
        : <span>Tap the plane to drop a pin{genre ? ` in ${genre}` : ""}, or feed it a track.</span>;

      return (
        <section>
          <div className="sr-only" aria-live="polite" aria-atomic="true">{announcement}</div>

          <div className="hero">
            <div className="eyebrow">01 · Atlas</div>
            <h1 className="display">Drop a pin. <strong>Hear the field.</strong></h1>
            <p className="lede">Pick a genre to scatter real tracks across the plane. Click anywhere and we'll pull the nearest songs by feel.</p>
          </div>

          {demoMode && (
            <div className="demo-banner" role="alert">
              <span className="demo-dot" aria-hidden="true" />
              Offline demo · server didn't answer
            </div>
          )}

          <div className="genre-section">
            <div className="genre-label">Filter by sound</div>
            <div className="chips">
              {GENRES.map(g => (
                <button
                  key={g.label}
                  className={"chip" + (genre === g.query && !uploadResult ? " active" : "")}
                  onClick={() => handleGenreSelect(g.query)}
                  aria-pressed={genre === g.query && !uploadResult}
                >
                  {g.label}
                </button>
              ))}
              <button
                className={"chip" + (uploadResult ? " active" : "")}
                onClick={handleUploadClick}
                disabled={uploadLoading}
                aria-pressed={!!uploadResult}
                title="Upload an audio file to find tracks with a similar mood"
              >
                {uploadLoading
                  ? "Analyzing…"
                  : uploadResult
                    ? "↑ " + (uploadResult.filename.length > 18 ? uploadResult.filename.slice(0, 16) + "…" : uploadResult.filename)
                    : "↑ Upload"}
              </button>
              <input
                ref={fileInputRef}
                type="file"
                accept="audio/*,.mp3,.wav,.flac,.ogg,.m4a"
                style={{display: "none"}}
                onChange={handleFileChange}
              />
            </div>
          </div>

          <div className="mood-wrap">
            <div className="plane-wrap">
              <MoodPlane
                points={seed}
                point={point}
                pointLabel={uploadResult
                  ? (uploadResult.filename.length > 22 ? uploadResult.filename.slice(0, 20) + "…" : uploadResult.filename)
                  : null}
                onPick={searchAt}
              />
              {seedLoading && (
                <div className="seed-overlay" aria-hidden="true">
                  Loading {genre || "pool"}…
                </div>
              )}
            </div>
            <div className="mood-side">
              <div className="mood-coord">{coordText}</div>
              {uploadResult && !uploadLoading && (
                <div className="upload-card">
                  <div className="upload-card-name">{uploadResult.filename}</div>
                  <div className="upload-card-feat">
                    v <b>{uploadResult.valence}</b> · e <b>{uploadResult.energy}</b> · <b>{uploadResult.tempo}</b> bpm
                  </div>
                </div>
              )}
              {uploadError && (
                <div className="error" style={{padding: "6px 0"}}>{uploadError}</div>
              )}
              <div className="mood-presets">
                {MOOD_PRESETS.map(p => (
                  <button key={p.label} className="mood-preset" onClick={() => searchAt({ valence: p.v, energy: p.e })}>
                    {p.label}
                  </button>
                ))}
              </div>
              {results && (
                <div className="info--compact">
                  showing <span style={{color:"var(--ink-2)"}}>{(results.recommendations || []).length}</span> / <span style={{color:"var(--ink-2)"}}>{results.candidate_count || 0}</span> candidates
                </div>
              )}
            </div>
          </div>

          {error && (
            <div className="error-wrap" role="alert">
              <span className="error-msg">{error}</span>
              {point && (
                <button className="error-retry" onClick={() => searchAt(point)}>Try again</button>
              )}
            </div>
          )}
          {loading && <SkeletonList n={4} />}
          {!loading && results && (
            <>
              <h2>
                Tracks near this mood
                <span className="count">{results.recommendations.length} results</span>
              </h2>
              {results.recommendations.length === 0
                ? (
                  <div className="empty">
                    No tracks found near that point.
                    <div className="empty-presets">
                      {MOOD_PRESETS.map(p => (
                        <button key={p.label} className="mood-preset" onClick={() => searchAt({ valence: p.v, energy: p.e })}>
                          {p.label}
                        </button>
                      ))}
                    </div>
                  </div>
                )
                : (
                  <div className="results">
                    {results.recommendations.map((t, i) => <TrackRow key={t.id || i} t={t} i={i} showFeatures demoMode={demoMode} />)}
                  </div>
                )}
            </>
          )}
        </section>
      );
    }

    function TrackRow({ t, i, showFeatures, demoMode, highlight }) {
      const f = t.features || {};
      const featurePieces = [];
      if (f.tempo)        featurePieces.push(<span key="t"><b>{f.tempo}</b> bpm</span>);
      if (f.key != null)  featurePieces.push(<span key="k"><b>{keyLabel(f.key, f.mode)}</b></span>);
      if (f.energy != null)       featurePieces.push(<span key="e">e <b>{f.energy}</b></span>);
      if (f.danceability != null) featurePieces.push(<span key="d">d <b>{f.danceability}</b></span>);
      if (f.valence != null)      featurePieces.push(<span key="v">v <b>{f.valence}</b></span>);
      if (f.acousticness != null) featurePieces.push(<span key="a">ac <b>{f.acousticness}</b></span>);

      return (
        <div className={"track" + (highlight ? " highlight" : "")}>
          <div className="idx">{highlight ? "★" : String(i+1).padStart(2,"0")}</div>
          {t.image ? <img src={t.image} alt="" className="art" /> : <div className="ph-art" aria-hidden="true" />}
          <div className="body">
            <div className="name">{t.name}</div>
            <div className="meta">
              {Array.isArray(t.artists) ? t.artists.join(", ") : t.artists}
              {t.album ? <span className="album"> · {t.album}</span> : null}
            </div>
            {showFeatures && featurePieces.length > 0 && (
              <div className="features">
                {featurePieces.flatMap((el, idx) =>
                  idx === 0 ? [el] : [<span key={"s"+idx} className="sep">·</span>, el]
                )}
              </div>
            )}
          </div>
          {t.url && !demoMode && <a className="open" href={t.url} target="_blank" rel="noreferrer">Open ↗</a>}
        </div>
      );
    }

    function SkeletonList({ n = 4, withFeatures = false }) {
      return (
        <div className="results" aria-hidden="true">
          {Array.from({length: n}).map((_, i) => (
            <div key={i} className="track" style={{pointerEvents: "none"}}>
              <div className="idx mono">{String(i+1).padStart(2,"0")}</div>
              <div className="skel" style={{width: 56, height: 56, borderRadius: 6}} />
              <div className="body" style={{display: "flex", flexDirection: "column", gap: 6}}>
                <div className="skel" style={{height: 13, width: "55%"}} />
                <div className="skel" style={{height: 11, width: "35%"}} />
                {withFeatures && <div className="skel" style={{height: 9, width: "65%"}} />}
              </div>
              <div className="skel" style={{width: 52, height: 20, borderRadius: 4}} />
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
