<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spotify Search & Analyze</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0f0f10;
      --panel: #1a1a1d;
      --panel-2: #141416;
      --border: #2a2a2f;
      --text: #f1f1f1;
      --muted: #9a9a9f;
      --accent: #1db954;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container { max-width: 880px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    h2 { font-size: 16px; margin: 24px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    form, .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    form { display: grid; grid-template-columns: 1fr; gap: 10px; }

    label { font-size: 12px; color: var(--muted); }
    input, select {
      background: #0b0b0c;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 11px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }
    input:focus, select:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #000;
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .row { display: grid; grid-template-columns: 1fr 100px; gap: 10px; }

    .track {
      display: flex;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      align-items: center;
    }
    .track img, .artist img { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: #222; }
    .artist img { border-radius: 50%; }
    .track .name, .artist .name { font-weight: 600; }
    .track .meta, .artist .meta { color: var(--muted); font-size: 13px; }
    .track a, .artist a { color: var(--accent); text-decoration: none; font-size: 13px; }
    .empty, .error, .info { color: var(--muted); padding: 12px 4px; font-size: 14px; }
    .error { color: #ff6b6b; }
    .idx { width: 22px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

    .me-card { display: flex; align-items: center; gap: 12px; }
    .me-card img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #222; }
    .me-card .name { font-weight: 600; }
    .me-card .sub { color: var(--muted); font-size: 13px; }
    .spacer { flex: 1; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .stat .v { font-size: 20px; font-weight: 700; color: var(--accent); }
    .stat .k { color: var(--muted); font-size: 12px; margin-top: 4px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: #0b0b0c;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
    }
    .chip .count { color: var(--muted); margin-left: 6px; }

    .grid-artists { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .artist {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .artist img { width: 88px; height: 88px; }
    .artist .name { font-size: 13px; }
    .artist .meta { font-size: 11px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect } = React;

    const KEY_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    function keyLabel(k, mode) {
      if (k === null || k === undefined) return "";
      const name = KEY_NAMES[k] || "?";
      if (mode === 0) return name + "m";
      if (mode === 1) return name;
      return name;
    }

    function getInitialAuthError() {
      const sp = new URLSearchParams(window.location.search);
      return sp.get("auth_error") || null;
    }

    function App() {
      return (
        <div className="container">
          <h1>Spotify · My Music</h1>
          <MineTab />
        </div>
      );
    }

    function SearchTab() {
      const [query, setQuery] = useState("rainy day jazz");
      const [vibe, setVibe] = useState("cozy fireplace cafe");
      const [limit, setLimit] = useState(10);
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [searched, setSearched] = useState(false);

      async function onSubmit(e) {
        e.preventDefault();
        setLoading(true);
        setError(null);
        try {
          const params = new URLSearchParams({ q: query, vibe, limit: String(limit) });
          const res = await fetch(`/api/search?${params}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          setResults(data.results || []);
          setSearched(true);
        } catch (err) {
          setError(err.message);
          setResults([]);
        } finally {
          setLoading(false);
        }
      }

      return (
        <div>
          <form onSubmit={onSubmit}>
            <div>
              <label htmlFor="q">Query</label>
              <input id="q" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="rainy day jazz" />
            </div>
            <div>
              <label htmlFor="vibe">Vibe keywords (space-separated)</label>
              <input id="vibe" value={vibe} onChange={(e) => setVibe(e.target.value)} placeholder="cozy fireplace cafe" />
            </div>
            <div className="row">
              <div>
                <label htmlFor="limit">Limit (max 10)</label>
                <input id="limit" type="number" min="1" max="10" value={limit} onChange={(e) => setLimit(Number(e.target.value))} />
              </div>
              <div style={{ display: "flex", alignItems: "flex-end" }}>
                <button type="submit" disabled={loading || !query.trim()}>
                  {loading ? "Searching…" : "Search"}
                </button>
              </div>
            </div>
          </form>

          {error && <div className="error">Error: {error}</div>}
          {!error && searched && results.length === 0 && <div className="empty">No results.</div>}

          {results.map((t, i) => (
            <div key={t.url || i} className="track">
              <div className="idx">{i + 1}</div>
              {t.image ? <img src={t.image} alt="" /> : <div style={{ width: 56, height: 56, borderRadius: 6, background: "#222" }} />}
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="name">{t.name}</div>
                <div className="meta">{t.artists.join(", ")} · {t.album}</div>
                {t.url && <a href={t.url} target="_blank" rel="noreferrer">Open in Spotify ↗</a>}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function FilterTab() {
      const [query, setQuery] = useState("indie rock");
      const [tempoMin, setTempoMin] = useState(110);
      const [tempoMax, setTempoMax] = useState(140);
      const [energyMin, setEnergyMin] = useState(0.5);
      const [energyMax, setEnergyMax] = useState(1.0);
      const [danceMin, setDanceMin] = useState(0.0);
      const [danceMax, setDanceMax] = useState(1.0);
      const [valenceMin, setValenceMin] = useState(0.0);
      const [valenceMax, setValenceMax] = useState(1.0);
      const [acousticMin, setAcousticMin] = useState(0.0);
      const [acousticMax, setAcousticMax] = useState(1.0);
      const [keySel, setKeySel] = useState("");
      const [modeSel, setModeSel] = useState("");
      const [limit, setLimit] = useState(10);

      const [results, setResults] = useState([]);
      const [meta, setMeta] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [searched, setSearched] = useState(false);

      async function onSubmit(e) {
        e.preventDefault();
        setLoading(true);
        setError(null);
        try {
          const params = new URLSearchParams({
            q: query,
            tempo_min: String(tempoMin),
            tempo_max: String(tempoMax),
            energy_min: String(energyMin),
            energy_max: String(energyMax),
            danceability_min: String(danceMin),
            danceability_max: String(danceMax),
            valence_min: String(valenceMin),
            valence_max: String(valenceMax),
            acousticness_min: String(acousticMin),
            acousticness_max: String(acousticMax),
            limit: String(limit),
          });
          if (keySel !== "") params.set("key", keySel);
          if (modeSel !== "") params.set("mode", modeSel);

          const res = await fetch(`/api/filter?${params}`);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
          setResults(data.results || []);
          setMeta({ candidate_count: data.candidate_count, feature_coverage: data.feature_coverage });
          setSearched(true);
        } catch (err) {
          setError(err.message);
          setResults([]);
          setMeta(null);
        } finally {
          setLoading(false);
        }
      }

      const rangeStyle = { display: "grid", gridTemplateColumns: "120px 1fr 1fr", gap: 8, alignItems: "center", marginBottom: 8 };

      return (
        <div>
          <form onSubmit={onSubmit}>
            <div>
              <label htmlFor="fq">Query (genre, mood, artist…)</label>
              <input id="fq" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="indie rock" />
            </div>

            <div style={rangeStyle}>
              <label>Tempo (BPM)</label>
              <input type="number" min="40" max="220" step="1" value={tempoMin} onChange={(e) => setTempoMin(Number(e.target.value))} />
              <input type="number" min="40" max="220" step="1" value={tempoMax} onChange={(e) => setTempoMax(Number(e.target.value))} />
            </div>
            <div style={rangeStyle}>
              <label>Energy (0–1)</label>
              <input type="number" min="0" max="1" step="0.05" value={energyMin} onChange={(e) => setEnergyMin(Number(e.target.value))} />
              <input type="number" min="0" max="1" step="0.05" value={energyMax} onChange={(e) => setEnergyMax(Number(e.target.value))} />
            </div>
            <div style={rangeStyle}>
              <label>Danceability (0–1)</label>
              <input type="number" min="0" max="1" step="0.05" value={danceMin} onChange={(e) => setDanceMin(Number(e.target.value))} />
              <input type="number" min="0" max="1" step="0.05" value={danceMax} onChange={(e) => setDanceMax(Number(e.target.value))} />
            </div>
            <div style={rangeStyle}>
              <label>Valence (0–1)</label>
              <input type="number" min="0" max="1" step="0.05" value={valenceMin} onChange={(e) => setValenceMin(Number(e.target.value))} />
              <input type="number" min="0" max="1" step="0.05" value={valenceMax} onChange={(e) => setValenceMax(Number(e.target.value))} />
            </div>
            <div style={rangeStyle}>
              <label>Acousticness (0–1)</label>
              <input type="number" min="0" max="1" step="0.05" value={acousticMin} onChange={(e) => setAcousticMin(Number(e.target.value))} />
              <input type="number" min="0" max="1" step="0.05" value={acousticMax} onChange={(e) => setAcousticMax(Number(e.target.value))} />
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 100px 120px", gap: 10 }}>
              <div>
                <label htmlFor="key">Key</label>
                <select id="key" value={keySel} onChange={(e) => setKeySel(e.target.value)}>
                  <option value="">Any</option>
                  {KEY_NAMES.map((n, i) => (
                    <option key={i} value={i}>{n}</option>
                  ))}
                </select>
              </div>
              <div>
                <label htmlFor="mode">Mode</label>
                <select id="mode" value={modeSel} onChange={(e) => setModeSel(e.target.value)}>
                  <option value="">Any</option>
                  <option value="1">Major</option>
                  <option value="0">Minor</option>
                </select>
              </div>
              <div>
                <label htmlFor="flimit">Limit</label>
                <input id="flimit" type="number" min="1" max="20" value={limit} onChange={(e) => setLimit(Number(e.target.value))} />
              </div>
              <div style={{ display: "flex", alignItems: "flex-end" }}>
                <button type="submit" disabled={loading || !query.trim()}>
                  {loading ? "Filtering…" : "Filter"}
                </button>
              </div>
            </div>
          </form>

          <div className="info" style={{ fontSize: 12 }}>
            Audio features via <a href="https://reccobeats.com" target="_blank" rel="noreferrer" style={{ color: "var(--accent)" }}>ReccoBeats</a>. Spotify deprecated their own audio-features endpoint for new apps.
          </div>

          {error && <div className="error">Error: {error}</div>}
          {!error && searched && results.length === 0 && (
            <div className="empty">
              No matches.{meta && ` Searched ${meta.candidate_count} candidates, ${meta.feature_coverage} had features.`}
            </div>
          )}
          {!error && searched && results.length > 0 && meta && (
            <div className="info" style={{ fontSize: 12 }}>
              {results.length} of {meta.feature_coverage} feature-known tracks ({meta.candidate_count} total candidates).
            </div>
          )}

          {results.map((t, i) => {
            const f = t.features || {};
            return (
              <div key={t.url || i} className="track">
                <div className="idx">{i + 1}</div>
                {t.image ? <img src={t.image} alt="" /> : <div style={{ width: 56, height: 56, borderRadius: 6, background: "#222" }} />}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="name">{t.name}</div>
                  <div className="meta">{t.artists.join(", ")} · {t.album}</div>
                  <div className="meta" style={{ fontFamily: "ui-monospace, monospace", fontSize: 12 }}>
                    {f.tempo ? `${f.tempo} BPM` : ""}
                    {f.key !== null && f.key !== undefined ? ` · ${keyLabel(f.key, f.mode)}` : ""}
                    {f.energy !== null && f.energy !== undefined ? ` · energy ${f.energy}` : ""}
                    {f.danceability !== null && f.danceability !== undefined ? ` · dance ${f.danceability}` : ""}
                    {f.valence !== null && f.valence !== undefined ? ` · valence ${f.valence}` : ""}
                  </div>
                  {t.url && <a href={t.url} target="_blank" rel="noreferrer">Open in Spotify ↗</a>}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function MineTab() {
      const [me, setMe] = useState(null);
      const [meLoading, setMeLoading] = useState(true);
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [timeRange, setTimeRange] = useState("medium_term");
      const [authError] = useState(getInitialAuthError());
      const [playlists, setPlaylists] = useState([]);
      const [playlistsLoading, setPlaylistsLoading] = useState(false);
      const [playlistStats, setPlaylistStats] = useState({});
      const [playlistLoadingId, setPlaylistLoadingId] = useState(null);
      const [playlistRecs, setPlaylistRecs] = useState({});
      const [playlistRecsLoadingId, setPlaylistRecsLoadingId] = useState(null);
      const [tab, setTab] = useState("library");

      async function loadPlaylists() {
        setPlaylistsLoading(true);
        try {
          const res = await fetch("/api/playlists");
          const j = await res.json();
          if (res.ok) setPlaylists(j.playlists || []);
        } catch {
          /* ignore */
        } finally {
          setPlaylistsLoading(false);
        }
      }

      async function analyzePlaylist(id) {
        setPlaylistLoadingId(id);
        try {
          const res = await fetch(`/api/playlists/${id}/stats`);
          const j = await res.json();
          if (res.ok) setPlaylistStats((prev) => ({ ...prev, [id]: j }));
        } catch {
          /* ignore */
        } finally {
          setPlaylistLoadingId(null);
        }
      }

      async function findSimilar(id) {
        setPlaylistRecsLoadingId(id);
        try {
          const res = await fetch(`/api/playlists/${id}/recommendations?count=10`);
          const j = await res.json();
          if (res.ok) setPlaylistRecs((prev) => ({ ...prev, [id]: j }));
        } catch {
          /* ignore */
        } finally {
          setPlaylistRecsLoadingId(null);
        }
      }

      async function loadMe() {
        setMeLoading(true);
        try {
          const res = await fetch("/api/me");
          const j = await res.json();
          setMe(j);
        } catch {
          setMe({ authenticated: false });
        } finally {
          setMeLoading(false);
        }
      }

      async function loadAnalyze(range) {
        setLoading(true);
        setError(null);
        try {
          const res = await fetch(`/api/analyze?time_range=${range}`);
          const j = await res.json();
          if (!res.ok) {
            if (res.status === 401) {
              setMe({ authenticated: false });
              setData(null);
              return;
            }
            throw new Error(j.error || `HTTP ${res.status}`);
          }
          setData(j);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => { loadMe(); }, []);
      useEffect(() => {
        if (me && me.authenticated) loadAnalyze(timeRange);
      }, [me && me.authenticated, timeRange]);
      useEffect(() => {
        if (me && me.authenticated) loadPlaylists();
      }, [me && me.authenticated]);

      async function logout() {
        await fetch("/logout", { method: "POST" });
        setMe({ authenticated: false });
        setData(null);
        setPlaylists([]);
        setPlaylistStats({});
        setPlaylistRecs({});
      }

      if (meLoading) return <div className="info">Loading…</div>;

      if (!me || !me.authenticated) {
        return (
          <div className="panel">
            <div style={{ marginBottom: 12 }}>Connect your Spotify account to analyze your top tracks, top artists, top genres, and recent listens.</div>
            {authError && <div className="error" style={{ marginBottom: 8 }}>Auth error: {authError}</div>}
            <a href="/login"><button>Connect Spotify</button></a>
            <div className="info" style={{ marginTop: 10, fontSize: 12 }}>
              Note: add <code>http://127.0.0.1:5050/callback</code> as a Redirect URI in your Spotify app settings.
            </div>
          </div>
        );
      }

      const rangeLabel = {
        short_term: "Last 4 weeks",
        medium_term: "Last 6 months",
        long_term: "All time",
      };

      return (
        <div>
          <div className="panel me-card">
            {me.image ? <img src={me.image} alt="" /> : <div style={{ width: 48, height: 48, borderRadius: "50%", background: "#222" }} />}
            <div>
              <div className="name">{me.display_name}</div>
              <div className="sub">{me.country || ""}</div>
            </div>
            <div className="spacer" />
            <button className="secondary" onClick={logout}>Disconnect</button>
          </div>

          <div className="tabs">
            <button className={`tab ${tab === "library" ? "active" : ""}`} onClick={() => setTab("library")}>Library</button>
            <button className={`tab ${tab === "stats" ? "active" : ""}`} onClick={() => setTab("stats")}>Stats</button>
          </div>

          {error && <div className="error">Error: {error}</div>}
          {loading && tab === "stats" && <div className="info">Analyzing your music…</div>}

          {tab === "stats" && data && !loading && (
            <div>
              <div className="panel">
                <label htmlFor="range">Time range</label>
                <select id="range" value={timeRange} onChange={(e) => setTimeRange(e.target.value)}>
                  <option value="short_term">Last 4 weeks</option>
                  <option value="medium_term">Last 6 months</option>
                  <option value="long_term">All time</option>
                </select>
              </div>

              <div className="stats">
                <div className="stat">
                  <div className="v">{data.stats.avg_tempo ?? "—"}</div>
                  <div className="k">Avg tempo (BPM)</div>
                </div>
                <div className="stat">
                  <div className="v">{data.stats.avg_energy ?? "—"}</div>
                  <div className="k">Avg energy</div>
                </div>
                <div className="stat">
                  <div className="v">{data.stats.avg_danceability ?? "—"}</div>
                  <div className="k">Avg danceability</div>
                </div>
              </div>
              {data.stats.feature_total > 0 && (
                <div className="info" style={{ fontSize: 12, padding: "6px 4px 0" }}>
                  Audio features for {data.stats.feature_coverage}/{data.stats.feature_total} top tracks via ReccoBeats.
                </div>
              )}

              <h2>Top artists · {rangeLabel[timeRange]}</h2>
              {data.top_artists.length === 0 ? (
                <div className="empty">No top artists yet.</div>
              ) : (
                <div className="grid-artists">
                  {data.top_artists.map((a, i) => (
                    <a key={a.url || i} href={a.url} target="_blank" rel="noreferrer" className="artist" style={{ textDecoration: "none", color: "inherit" }}>
                      {a.image ? <img src={a.image} alt="" /> : <div style={{ width: 88, height: 88, borderRadius: "50%", background: "#222" }} />}
                      <div className="name">{a.name}</div>
                    </a>
                  ))}
                </div>
              )}

              <h2>Top tracks</h2>
              {data.top_tracks.length === 0 ? (
                <div className="empty">No top tracks yet.</div>
              ) : (
                data.top_tracks.map((t, i) => (
                  <div key={t.url || i} className="track">
                    <div className="idx">{i + 1}</div>
                    {t.image ? <img src={t.image} alt="" /> : <div style={{ width: 56, height: 56, borderRadius: 6, background: "#222" }} />}
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="name">{t.name}</div>
                      <div className="meta">{t.artists.join(", ")} · {t.album}</div>
                      {t.url && <a href={t.url} target="_blank" rel="noreferrer">Open in Spotify ↗</a>}
                    </div>
                  </div>
                ))
              )}
            </div>
          )}

          {tab === "library" && (
            <div>
              <h2>Your playlists</h2>
              {playlistsLoading ? (
                <div className="info">Loading playlists…</div>
              ) : playlists.length === 0 ? (
                <div className="empty">No playlists.</div>
              ) : (
                playlists.map((p) => {
                  const s = playlistStats[p.id];
                  const recs = playlistRecs[p.id];
                  const recsLoading = playlistRecsLoadingId === p.id;
                  return (
                    <div key={p.id} style={{ marginBottom: 10 }}>
                      <div className="track" style={{ marginBottom: 0 }}>
                        {p.image ? <img src={p.image} alt="" /> : <div style={{ width: 56, height: 56, borderRadius: 6, background: "#222" }} />}
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div className="name">{p.name}</div>
                          <div className="meta">{p.owner}</div>
                          {s && (
                            s.track_count === 0 ? (
                              <div className="meta" style={{ fontSize: 12 }}>Empty playlist.</div>
                            ) : (
                              <div className="meta" style={{ fontFamily: "ui-monospace, monospace", fontSize: 12, marginTop: 6 }}>
                            {s.stats.avg_tempo ?? "—"} BPM · energy {s.stats.avg_energy ?? "—"} · dance {s.stats.avg_danceability ?? "—"}
                                <span style={{ opacity: 0.6 }}> ({s.feature_coverage}/{s.track_count} tracks{s.track_count >= s.max_tracks ? `, capped at ${s.max_tracks}` : ""})</span>
                              </div>
                            )
                          )}
                          {p.url && <a href={p.url} target="_blank" rel="noreferrer">Open in Spotify ↗</a>}
                        </div>
                        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                          {!s && (
                            <button
                              className="secondary"
                              onClick={() => analyzePlaylist(p.id)}
                              disabled={playlistLoadingId === p.id}
                            >
                              {playlistLoadingId === p.id ? "…" : "Analyze"}
                            </button>
                          )}
                          {s && s.track_count > 0 && !recs && (
                            <button
                              className="secondary"
                              onClick={() => findSimilar(p.id)}
                              disabled={recsLoading}
                            >
                              {recsLoading ? "Finding…" : "Find similar"}
                            </button>
                          )}
                        </div>
                      </div>

                      {recs && (
                        <div className="panel" style={{ marginTop: 8, marginBottom: 0 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "0 0 8px" }}>
                            <div className="info" style={{ fontSize: 12, padding: 0, flex: 1 }}>
                              Similar tracks (avg target: {recs.playlist_stats?.avg_tempo ?? "—"} BPM · energy {recs.playlist_stats?.avg_energy ?? "—"} · dance {recs.playlist_stats?.avg_danceability ?? "—"})
                            </div>
                            <button
                              className="secondary"
                              style={{ padding: "5px 10px", fontSize: 12 }}
                              onClick={() => findSimilar(p.id)}
                              disabled={recsLoading}
                            >
                              {recsLoading ? "Rolling…" : "Re-roll"}
                            </button>
                          </div>
                          {recs.recommendations.length === 0 ? (
                            <div className="empty">No similar tracks found.</div>
                          ) : (
                            recs.recommendations.map((r, i) => {
                              const f = r.features || {};
                              return (
                                <div key={r.id || i} className="track">
                                  <div className="idx">{i + 1}</div>
                                  {r.image ? <img src={r.image} alt="" /> : <div style={{ width: 56, height: 56, borderRadius: 6, background: "#222" }} />}
                                  <div style={{ flex: 1, minWidth: 0 }}>
                                    <div className="name">{r.name}</div>
                                    <div className="meta">{r.artists.join(", ")}{r.album ? ` · ${r.album}` : ""}</div>
                                    <div className="meta" style={{ fontFamily: "ui-monospace, monospace", fontSize: 12 }}>
                                      {f.tempo ?? "—"} BPM · energy {f.energy ?? "—"} · dance {f.danceability ?? "—"}
                                    </div>
                                    {r.url && <a href={r.url} target="_blank" rel="noreferrer">Open in Spotify ↗</a>}
                                  </div>
                                </div>
                              );
                            })
                          )}
                        </div>
                      )}
                    </div>
                  );
                })
              )}

              <h2>Recently played</h2>
              {!data ? (
                <div className="info">Loading…</div>
              ) : data.recent.length === 0 ? (
                <div className="empty">Nothing recent.</div>
              ) : (
                data.recent.map((t, i) => (
                  <div key={(t.url || "") + i} className="track">
                    <div className="idx">{i + 1}</div>
                    {t.image ? <img src={t.image} alt="" /> : <div style={{ width: 56, height: 56, borderRadius: 6, background: "#222" }} />}
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div className="name">{t.name}</div>
                      <div className="meta">{t.artists.join(", ")} · {t.album}</div>
                      {t.url && <a href={t.url} target="_blank" rel="noreferrer">Open in Spotify ↗</a>}
                    </div>
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
